<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Øveprøver</title>
<meta name="description" content="Interaktive øveprøver til skolen">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-title" content="Øveprøver">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --text: #1d1d1f; --muted: #5f6368;
    --accent: #1f3a5f; --border: #e3dfd6; --new: #2e7d32; --gold: #e6b44a; --gold-text: #8a6100;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171a; --card: #1f2226; --text: #f1f1f1; --muted: #a8adb3;
            --accent: #8fb7e8; --border: #30343a; --new: #81c784;
            --gold: #c9962f; --gold-text: #ffcf4d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 12px; }
  h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 28px 0 10px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  a.card { display: flex; gap: 14px; align-items: center; padding: 16px; min-height: 84px;
           background: var(--card); border: 1px solid var(--border); border-radius: 14px;
           color: inherit; text-decoration: none; transition: transform .1s, border-color .1s; }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); transform: translateY(-1px); }
  .ico { font-size: 2rem; line-height: 1; flex: none; }
  .t { font-weight: 700; color: var(--accent); }
  .d { display: block; font-size: .9rem; color: var(--muted); }
  .ny { font-size: .7rem; font-weight: 700; color: var(--new); border: 1px solid currentColor;
        border-radius: 999px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
  footer { margin-top: 40px; font-size: .85rem; color: var(--muted); }
  a.meg { display: flex; gap: 16px; align-items: center; padding: 14px 18px 14px 14px; margin: 18px 0 4px;
           background: var(--card); border: 2px solid var(--gold); border-radius: 18px; color: inherit; text-decoration: none; }
  a.meg:hover, a.meg:focus-visible { transform: translateY(-1px); }
  .meg-ava { width: 92px; height: 100px; flex: none; border-radius: 14px; overflow: hidden; background: #e8eef7; }
  .meg-ava svg { width: 100%; height: 100%; display: block; }
  .meg-navn { font-weight: 800; font-size: 1.25rem; }
  .meg-gull { font-weight: 800; font-size: 1.15rem; color: var(--gold-text); display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .meg-gull .gm-mynt { font-size: 1.2rem; }
  .meg-tips { display: block; font-size: .9rem; color: var(--muted); }
  .meg-pil { margin-left: auto; font-size: 1.4rem; color: var(--accent); }
  .tjent { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: .8rem; font-weight: 700; color: var(--gold-text); }
</style>
</head>
<body>
<main>
  <h1>Øveprøver</h1>
  <p class="lead">Velg et spill og sett i gang. Riktige svar gir gull du kan bruke på avataren din. Alt lagres på denne enheten.</p>
  <a class="meg" id="meg" href="../avatar.html"></a>
  <div id="liste"></div>
  <footer>Tips: På iPhone og iPad, trykk Del → «Legg til på Hjem-skjerm».</footer>
</main>

<script src="../felles/gull.js" data-merke="av"></script>
<script src="../felles/spill.js"></script>
<script>
const NY_DAGER = 14;
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };
const liste = document.getElementById("liste");
const gull = window.Gull ? Gull.tilstand() : { spill: {}, gull: 0 };

/* ---------- avatarkortet ---------- */
function visMeg() {
  const m = document.getElementById("meg");
  if (!window.Gull) { m.hidden = true; return; }
  const s = Gull.tilstand(), mynt = '<span class="gm-mynt" aria-hidden="true"></span>';
  if (s.laget) {
    m.innerHTML = `<span class="meg-ava">${Gull.tegn(s)}</span><span><span class="meg-navn">${Gull.esc(s.navn || "Avataren min")}</span>` +
      `<span class="meg-gull">${mynt} ${s.gull} gull</span><span class="meg-tips">Butikk og garderobe</span></span><span class="meg-pil" aria-hidden="true">→</span>`;
  } else {
    m.innerHTML = `<span class="meg-ava">${Gull.tegn({ kjonn: "gutt", ut: { hud: 1, har: "kort", harfarge: 1, oyne: 0 }, paa: { hode: "partyhatt" } })}</span>` +
      `<span><span class="meg-navn">Lag din avatar!</span>${s.gull ? `<span class="meg-gull">${mynt} ${s.gull} gull</span>` : ""}` +
      `<span class="meg-tips">Tjen gull i spillene og kjøp klær, utstyr og kjæledyr.</span></span><span class="meg-pil" aria-hidden="true">→</span>`;
  }
}
visMeg();
if (window.Gull) { Gull.onEndring(visMeg); }
const fagRekke = [...new Set(SPILL.map(s => s.fag))];
for (const fag of fagRekke) {
  liste.append(el("h2", null, fag));
  const grid = el("div", "grid");
  for (const s of SPILL.filter(x => x.fag === fag)) {
    const a = el("a", "card"); a.href = "../" + s.fil;
    const tekst = el("span");
    const t = el("span", "t", s.tittel);
    const dager = (Date.now() - new Date(s.lagt)) / 864e5;
    if (dager >= 0 && dager < NY_DAGER) t.append(el("span", "ny", "Ny"));
    tekst.append(t, el("span", "d", s.beskrivelse));
    const tjent = gull.spill[s.fil.replace(/\.html$/, "")];
    if (tjent) { const g = el("span", "tjent"); g.innerHTML = '<span class="gm-mynt" aria-hidden="true"></span> ' + tjent + " gull tjent"; tekst.append(g); }
    a.append(el("span", "ico", s.ikon), tekst);
    grid.append(a);
  }
  liste.append(grid);
}
</script>
</body>
</html>
