<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Delefabrikken</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Deling opp til 200: små tall med gangetabellen baklengs og store tall som deles opp i lette biter">
<meta name="theme-color" content="#6a3fb5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap">
<style>
/* Delefabrikken: ruteark som Regneverkstedet, men i fiolett med kakebrune detaljer.
   Feil er varm korall, aldri rødt. */
:root{
  --bg:#f9f7fc; --gl:#e4ddf0; --card:#ffffff; --card2:#f2eef9; --line:#dcd3ea;
  --ink:#231c33; --muted:#665d78;
  --pri:#6a3fb5; --pri-ink:#ffffff; --pri-soft:#ebe2fa;
  --acc:#b8621b; --acc-ink:#ffffff; --acc-soft:#fbe9d8;
  --gold:#e3a200; --gold-soft:#fff2c2;
  --coral:#c4573a; --coral-soft:#fbe3da;
  --ok:#22804a; --ok-soft:#dcf2e4;
  --hl:#fff4c7;
  --ck:#dba45f; --chip:#5b3413;
  --fd:"Fredoka","Segoe UI",system-ui,sans-serif;
  --fb:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --fh:"Patrick Hand","Comic Sans MS",cursive;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#15121c; --gl:#231e2e; --card:#1e1a28; --card2:#28223a; --line:#3a3150;
  --ink:#f1edf8; --muted:#aea4c2;
  --pri:#b99cff; --pri-ink:#1a0f33; --pri-soft:#2e2350;
  --acc:#ffb36b; --acc-ink:#2b1500; --acc-soft:#3b2814;
  --gold:#ffcd38; --gold-soft:#3a3214;
  --coral:#f29d80; --coral-soft:#3f2620;
  --ok:#63d697; --ok-soft:#153424;
  --hl:#3a3418;
  --ck:#c98d4a; --chip:#3a210c;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15121c; --gl:#231e2e; --card:#1e1a28; --card2:#28223a; --line:#3a3150;
    --ink:#f1edf8; --muted:#aea4c2;
    --pri:#b99cff; --pri-ink:#1a0f33; --pri-soft:#2e2350;
    --acc:#ffb36b; --acc-ink:#2b1500; --acc-soft:#3b2814;
    --gold:#ffcd38; --gold-soft:#3a3214;
    --coral:#f29d80; --coral-soft:#3f2620;
    --ok:#63d697; --ok-soft:#153424;
    --hl:#3a3418;
    --ck:#c98d4a; --chip:#3a210c;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--fb);font-size:1.1rem;line-height:1.5;min-height:100vh;
  background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);background-size:24px 24px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.8rem} h2{font-size:1.35rem} h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.92rem}
.nowrap{white-space:nowrap}

/* topp */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:720px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{white-space:nowrap;background:none;border:0;padding:4px 0;font-family:var(--fd);font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:8px;color:var(--pri)}
.tools{display:flex;gap:6px;align-items:center}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;display:inline-grid;place-items:center;padding:0;font-size:1.1rem}

.wrap{max-width:720px;margin:0 auto;padding:16px 16px 90px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px 18px;font-weight:700;min-height:50px;transition:transform .08s;text-align:center}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:transparent}
.btn.big{font-size:1.2rem;min-height:58px}
.btn.ghost{background:var(--card)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 150px}
.back{background:none;border:0;color:var(--pri);font-weight:700;padding:6px 0}
.sec{font-size:1.15rem;margin:4px 2px 0;color:var(--muted);font-family:var(--fd)}

/* forside */
.hero{display:flex;flex-direction:column;gap:12px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card2);padding:6px;border-radius:18px;border:1px solid var(--line)}
.seg3 button{border:0;background:transparent;border-radius:14px;padding:8px 4px;font-family:var(--fd);font-weight:600;font-size:1.05rem;line-height:1.15}
.seg3 .sym{display:block;font-size:1.6rem;line-height:1.2}
.seg3 small{display:block;font-family:var(--fb);font-weight:400;font-size:.8rem;color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 6px rgb(0 0 0/.1);color:var(--pri)}
.levels{display:flex;flex-direction:column;gap:8px}
.lvl{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;text-align:left;transition:border-color .1s}
.lvl:hover{border-color:var(--pri)}
.lvl[aria-pressed="true"]{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
.lvl .li{font-size:1.8rem;flex:none;width:44px;text-align:center}
.lvl .lt{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.25}
.lvl .lt b{font-family:var(--fd);font-weight:600;font-size:1.1rem}
.lvl .lt small{color:var(--muted);font-size:.9rem}
.lvl .ex{font-family:var(--fh);font-size:1.15rem;color:var(--pri)}
.lvl .ls{flex:none;font-size:.9rem;font-weight:700;color:var(--muted);text-align:right}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left;min-height:118px;transition:border-color .1s,transform .1s}
.mode:hover{border-color:var(--pri);transform:translateY(-1px)}
.mode .mi{font-size:1.8rem;line-height:1}
.mode b{font-family:var(--fd);font-weight:600;font-size:1.15rem}
.mode small{color:var(--muted);font-size:.88rem;line-height:1.3}
.stars{color:var(--line);letter-spacing:2px;font-size:1.05rem;line-height:1;margin-top:auto;padding-top:4px}
.stars .on{color:var(--gold)}
.stars.big{font-size:2.6rem;letter-spacing:6px}
.alle{align-self:center;color:var(--pri);font-weight:700;text-decoration:none;padding:8px}

/* spill */
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prog{display:flex;gap:5px;flex-wrap:wrap}
.prog i{width:14px;height:14px;border-radius:50%;background:var(--card2);border:2px solid var(--line)}
.prog i.ok{background:var(--ok);border-color:var(--ok)}
.prog i.half{background:var(--gold);border-color:var(--gold)}
.prog i.miss{background:var(--coral-soft);border-color:var(--coral)}
.prog i.now{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.play{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.ask{font-size:1.15rem}
.fb{min-height:1.6em;font-weight:700;text-align:center;border-radius:12px;padding:8px 12px;background:var(--card2)}
.fb.good{background:var(--ok-soft);color:var(--ok)}
.fb.oops{background:var(--coral-soft);color:var(--coral)}
.fb.info{background:var(--pri-soft);color:var(--ink)}

.bigq{font-size:clamp(2rem,9vw,3rem);font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1.2}
.bigq.mid{font-size:clamp(1.7rem,7vw,2.4rem)}
.ansbox{display:inline-block;min-width:2.6ch;border-bottom:4px solid var(--gold);color:var(--pri);padding:0 .1em}
.ansbox.ok{border-color:var(--ok);color:var(--ok)}

/* tastatur */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;width:100%;margin:0 auto}
.pad button{min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:1.5rem;font-weight:700}
.pad button:active{transform:scale(.97)}
.pad .okk{background:var(--pri);color:var(--pri-ink);border-color:transparent;font-size:1.15rem}

/* hjelp */
.strat{background:var(--card2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.strat .ln{font-size:1.25rem;font-variant-numeric:tabular-nums}
.strat .ln b{color:var(--acc)}
.hops{display:flex;flex-wrap:wrap;gap:6px}
.hop{min-width:2.6em;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.hop.end{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.fam p{grid-column:1/-1}

/* kaker */
.ck{display:inline-block;width:18px;height:18px;border-radius:50%;flex:none;background-color:var(--ck);
  background-image:radial-gradient(circle at 30% 35%,var(--chip) 1.8px,transparent 2.3px),radial-gradient(circle at 66% 58%,var(--chip) 1.8px,transparent 2.3px),radial-gradient(circle at 42% 76%,var(--chip) 1.4px,transparent 1.9px);
  box-shadow:inset -2px -2px 0 rgb(0 0 0/.15)}
.ck.sm{width:14px;height:14px}
.kaker{display:grid;grid-template-columns:repeat(var(--d),18px);gap:8px 4px;justify-content:center;padding:4px 0}
.kaker .rad{display:contents}
.demo{display:flex;flex-direction:column;gap:12px}
.pile{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;min-height:44px;padding:10px;border:2px dashed var(--line);border-radius:16px}
.plates{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.plate{width:104px;min-height:104px;border-radius:50%;background:var(--card);border:3px solid var(--line);box-shadow:inset 0 0 0 7px var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:2px}
.plate .pn{font-size:1.4rem;line-height:1}
.plate .pc{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:72px}

/* del opp: stolpe */
.bar{display:flex;gap:4px;width:100%}
.seg{min-width:5.6em;flex-basis:0;border-radius:12px;padding:8px 6px;background:var(--pri);color:var(--pri-ink);display:flex;flex-direction:column;align-items:center;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.seg.s2{background:var(--acc);color:var(--acc-ink)}
.seg.whole{flex:1}
.seg .v{font-size:1.5rem}
.seg .u{font-size:.95rem}
.steps{display:flex;flex-direction:column;gap:6px;align-items:center}
.stp{font-size:clamp(1.5rem,6.5vw,2rem);font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.stp.ok{color:var(--ok)}
.stp.fin{color:var(--pri);border-top:2px dashed var(--line);padding-top:6px;margin-top:2px}
.stp .lbl{display:block;font-size:.85rem;color:var(--muted);font-weight:700;font-family:var(--fb)}

/* tekstoppgaver */
.story{display:flex;gap:14px;align-items:flex-start}
.story .si{font-size:2.6rem;line-height:1;flex:none}
.story p{font-size:1.2rem;line-height:1.55}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice.c3{grid-template-columns:repeat(3,1fr)}
.choice .btn{font-size:1.15rem;min-height:64px;font-variant-numeric:tabular-nums}
.choice .btn .s{display:block;font-size:1.8rem;line-height:1}

/* lær */
.sol{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.soltxt{background:var(--card2);border-radius:14px;padding:12px 14px;min-height:3.4em;font-size:1.08rem}
.soltxt b{color:var(--acc)}
.solnav{display:flex;gap:8px;align-items:center;justify-content:space-between}
.solnav .cnt{font-size:.9rem;color:var(--muted);font-weight:700}
.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.res{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.res .row{width:100%}

#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,160%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;z-index:50;transition:transform .25s;max-width:min(92vw,440px);text-align:center}
#toast.on{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}

@media (max-width:480px){
  h1{font-size:1.5rem}
  .mode{min-height:110px;padding:10px 12px}
  .story .si{font-size:2rem}
  .logo{font-size:1.08rem;gap:5px}
  .iconbtn{width:36px;height:36px}
  .plate{width:88px;min-height:88px;padding:10px}
  .choice.c3 .btn{padding:10px 6px;font-size:1.05rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="felles/gull.js"></script>
</head>
<body>
<header class="top"><div class="topin">
  <button class="logo" data-act="home" aria-label="Til forsiden av Delefabrikken">🍪 Delefabrikken</button>
  <div class="tools">
    <span class="pill" id="pStars" title="Stjerner">⭐ 0</span>
    <button class="iconbtn" data-act="sound" id="bSound" aria-label="Lyd av eller på">🔊</button>
    <button class="iconbtn" data-act="theme" id="bTheme" aria-label="Bytt lys eller mørk modus">◐</button>
  </div>
</div></header>
<main class="wrap" id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx"></canvas>

<script>
/* =====================================================================
   DELEFABRIKKEN – deling opp til 200
   - Tallområde: små tall (opp til 100), store tall (100–200) eller begge.
   - Nivå etter hva man deler på: 2/5/10, 3/4/6, 7/8/9 eller alt fra 2 til 10.
   - Alle stykker går opp (ingen rest).
   - Øvinger: hoderegning, hva mangler (gange og dele hører sammen),
     del opp steg for steg (store stykker i lette biter) og tekstoppgaver.
   - Gull bare for riktig på første forsøk. Etter to bom vises fremgangsmåten.
   - Fremgang lagres kun lokalt (localStorage).
   ===================================================================== */
const KEY='delefabrikken-v1';
const LEVELS=[
  {id:'lett',ikon:'🌱',navn:'Lette',sub:'del på 2, 5 og 10',d:[2,5,10],ex:{sma:'35 : 5',store:'130 : 5'}},
  {id:'midt',ikon:'🌿',navn:'Middels',sub:'del på 3, 4 og 6',d:[3,4,6],ex:{sma:'24 : 4',store:'156 : 6'}},
  {id:'vansk',ikon:'🌳',navn:'Vanskelige',sub:'del på 7, 8 og 9',d:[7,8,9],ex:{sma:'56 : 7',store:'168 : 8'}},
  {id:'mix',ikon:'🎲',navn:'Blanding',sub:'del på alt fra 2 til 10',d:[2,3,4,5,6,7,8,9,10],ex:{sma:'45 : 9',store:'138 : 3'}},
];
const OMR=[
  {id:'sma',sym:'🍪',navn:'Små tall',sub:'opp til 100'},
  {id:'store',sym:'📦',navn:'Store tall',sub:'100 til 200'},
  {id:'begge',sym:'🎲',navn:'Begge',sub:'litt av hvert'},
];
const MODES=[
  {id:'hode',ikon:'🧠',navn:'Hoderegning',sub:'Regn i hodet – hjelp hvis du vil',n:10},
  {id:'mangler',ikon:'🧩',navn:'Hva mangler?',sub:'Gange og dele hører sammen',n:8},
  {id:'delopp',ikon:'🪜',navn:'Del opp',sub:'Store stykker i lette biter, steg for steg',n:6},
  {id:'tekst',ikon:'📚',navn:'Tekstoppgaver',sub:'Dele eller gange? Regn ut',n:6},
];
const DYR=['🐻','🐰','🦊','🐸','🐼','🐯','🐨','🐷','🐵','🐔'];
const ROS=['Riktig! 🎉','Ja, det stemmer!','Kjempebra!','Der satt den!','Supert regnet!','Helt riktig! ⭐','Du har kontroll!','Sånn skal det gjøres!'];
const ROS2=['Riktig nå! Bra at du ga deg ikke.','Ja! Du fant det ut.','Riktig! Sånn lærer man.'];

/* ---------- lagring ---------- */
function fresh(){return{v:1,omr:'sma',lv:'lett',best:{},rounds:0,right:0,sound:true,theme:'auto'}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.v===1)return Object.assign(fresh(),x)}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();

/* ---------- små hjelpere ---------- */
const $=s=>document.querySelector(s);
const app=$('#app');
const rnd=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const bland=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LV=id=>LEVELS.find(l=>l.id===id)||LEVELS[0];
const MD=id=>MODES.find(m=>m.id===id);

/* ---------- lyd, toast, konfetti, tema ---------- */
let AC;
function beep(kind){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
  const seq={ok:[[660,0],[880,.09]],up:[[523,0],[659,.1],[784,.2],[1047,.3]],soft:[[392,0]],tap:[[740,0]]}[kind]||[[600,0]];
  seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(kind==='soft'?.07:kind==='tap'?.05:.12,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.25);
    o.connect(g).connect(AC.destination);o.start(t+d);o.stop(t+d+.28)})}catch(e){}}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n=90){if(reduced())return;const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cl=['#e3a200','#6a3fb5','#b8621b','#22804a','#b99cff','#dba45f'];
  const ps=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.3,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,s:6+Math.random()*6,c:pick(cl)}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++f<170)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}
function applyTheme(){const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
  $('#bTheme').textContent={auto:'◐',light:'☀️',dark:'🌙'}[S.theme]}
function updTop(){let t=0;for(const k in S.best)t+=S.best[k];$('#pStars').textContent='⭐ '+t;$('#bSound').textContent=S.sound?'🔊':'🔇'}

/* =====================================================================
   OPPGAVER
   ===================================================================== */
/* lag et delestykke a : d = q som går opp.
   Små tall: a ≤ 100 (oftest gangetabellen baklengs). Store tall: 100 ≤ a ≤ 200.
   split: svaret er minst 11 og ikke et helt tiertall, så det gir mening å dele opp. */
function lag(lv,omr,o,brukt){
  o=o||{};
  for(let t=0;t<800;t++){
    const d=pick(lv.d);
    if(o.split&&d===10&&lv.d.length>1)continue;
    const big=omr==='store'?true:omr==='sma'?false:Math.random()<.5;
    let lo,hi;
    if(big){lo=Math.ceil(100/d);hi=Math.floor(200/d)}
    else{lo=2;hi=Math.floor(100/d);if(!o.split&&hi>10&&Math.random()<.6)hi=10}
    if(o.split)lo=Math.max(lo,11);
    if(lo>hi)continue;
    const q=rnd(lo,hi),a=q*d;
    if(o.split&&q%10===0)continue;
    if(big&&q%10===0&&Math.random()<.6)continue; // færre «runde» svar som 120 : 6
    const k=a+':'+d;
    if(brukt&&brukt.has(k)&&t<700)continue;
    brukt&&brukt.add(k);
    return {a,d,q};
  }
  return {a:24,d:4,q:6};
}
/* oppdeling: a = c + r, der c = d · t (t er et tiertall) og r = d · u */
function delOpp(p){const t=Math.floor(p.q/10)*10;return{t,u:p.q-t,c:t*p.d,r:p.a-t*p.d}}

/* ---------- visuelle hjelpere ---------- */
function hopsHTML(d,n,skjulSiste){let h='<div class="hops">';
  for(let i=1;i<=n;i++)h+=`<span class="hop${i===n?' end':''}">${i===n&&skjulSiste?'?':d*i}</span>`;
  return h+'</div>'}
function barHTML(p,vals,hel){

    <div class="seg s2" style="flex-grow:${r}"><span class="v">${r}</span><span class="u">: ${p.d} = ${vals[1]??'?'}</span></div></div>`;
}
function kakerHTML(p){

function familie(p){

    <div class="ln">${p.q} · ${p.d} = ${p.a}</div><div class="ln">${p.d} · ${p.q} = ${p.a}</div>
    <div class="ln">${p.a} : ${p.d} = <b>${p.q}</b></div><div class="ln">${p.a} : ${p.q} = <b>${p.d}</b></div></div>`;
}

/* ---------- strategi for a : d (full = vis hele løsningen) ---------- */
function strategi(p,full){
  const {a,d,q}=p;let h='<div class="strat">';
  if(d===10){
    h+=`<p class="small muted">Å dele på 10: Ta bort nullen bakerst.</p><div class="ln">${a} : 10 = <b>${full?q:'?'}</b></div>`;
  }else if(q<=10){
    h+=`<p class="small muted">Tell i ${d}-gangen til du kommer til ${a}. Hvor mange hopp ble det?</p>${hopsHTML(d,q)}`;
    h+=full?`<div class="ln">${q} hopp: ${q} · ${d} = ${a}, så ${a} : ${d} = <b>${q}</b></div>`:`<div class="ln">? · ${d} = ${a}</div>`;
  }else if(q%10===0){
    h+=`<p class="small muted">Tenk uten nullen: ${a/10} : ${d} = ${full?q/10:'?'}. Sett nullen på igjen etterpå.</p>`;
    h+=`<div class="ln">${a} : ${d} = <b>${full?q:'?'}</b></div>`;
  }else{
    const {t,u,c,r}=delOpp(p);
    if(d===2)h+=`<p class="small muted">Å dele på 2 er det samme som å halvere.</p>`;
    h+=`<p class="small muted">Del opp ${a} i biter som er lette å dele på ${d}:</p>${barHTML(p,[t,full?u:null])}
      <div class="ln">${c} : ${d} = ${t}</div><div class="ln">${r} : ${d} = ${full?`<b>${u}</b>`:'?'}</div>
      <div class="ln">${t} + ${full?u:'?'} = <b>${full?q:'svaret'}</b></div>`;
  }
  if(full)h+=`<p class="small muted">Sjekk med gange: ${q} · ${d} = ${a} ✔</p>`;
  return h+'</div>';
}
/* ---------- strategi for q · d ---------- */
function gangeStrategi(q,d,full){
  const a=q*d;let h='<div class="strat">';
  if(q<=10){
    h+=`<p class="small muted">${q} · ${d} er ${q} hopp i ${d}-gangen:</p>${hopsHTML(d,q,!full)}`;
    if(full)h+=`<div class="ln">${q} · ${d} = <b>${a}</b></div>`;
  }else if(q%10===0){
    h+=`<p class="small muted">Tenk ${q/10} · ${d} = ${full?a/10:'?'}, og sett på en null.</p><div class="ln">${q} · ${d} = <b>${full?a:'?'}</b></div>`;
  }else{
    const t=Math.floor(q/10)*10,u=q-t;
    h+=`<p class="small muted">Del opp ${q} i ${t} og ${u}, og gang hver del med ${d}:</p>
      <div class="ln">${t} · ${d} = ${t*d}</div><div class="ln">${u} · ${d} = ${full?u*d:'?'}</div>
      <div class="ln">${t*d} + ${full?u*d:'?'} = <b>${full?a:'svaret'}</b></div>`;
  }
  return h+'</div>';
}

/* ---------- hva mangler ---------- */
function manglerHjelp(p,full){
  if(full)return familie(p);
  if(p.form==='del')return strategi(p,false);
  if(p.form==='gange')return `<p class="small muted">? · ${p.d} = ${p.a} er det samme som ${p.a} : ${p.d} = ?</p>`+strategi(p,false);
  if(p.form==='dividend')return `<p class="small muted">? : ${p.d} = ${p.q} betyr: ${p.q} grupper med ${p.d} i hver. Regn ${p.q} · ${p.d}.</p>`+gangeStrategi(p.q,p.d,false);
  let h=`<div class="strat"><p class="small muted">${p.a} : ? = ${p.q} betyr at ${p.q} · ? = ${p.a}. Hvilken av disse stemmer?</p><div class="hops">`;
  for(let k=2;k<=10;k++)h+=`<span class="hop">${p.q} · ${k} = ${p.q*k}</span>`;
  return h+'</div></div>';
}

/* ---------- del opp: valg av oppdeling ---------- */
function splitValg(p){
  const {c,r}=delOpp(p),d=p.d,a=p.a;
  const plass=[[Math.floor(a/100)*100,a%100],[Math.floor(a/10)*10,a%10]];
  const andre=bland([[c+10,r-10],[c-10,r+10],[c+5,r-5],[c-5,r+5],[c+2,r-2],[c+1,r-1],[c-1,r+1]]);
  const ut=[],sett=new Set([c]);
  for(const [x,y] of [...plass,...andre]){
    if(ut.length>=2)break;
    if(x<=0||y<=0||sett.has(x))continue;
    if(x%d===0&&y%d===0)continue; // også en gyldig oppdeling – ikke bruk som feil svar
    sett.add(x);ut.push({x,y,ok:false});
  }
  ut.push({x:c,y:r,ok:true});
  return bland(ut);
}

let V='home',P=null,L=null;

function starsHTML(n,big){return `<span class="stars${big?' big':''}" aria-label="${n} av 3 stjerner">${[0,1,2].map(i=>`<span class="${i<n?'on':''}">★</span>`).join('')}</span>`}

/* ---------- runde ---------- */
function start(mode){
  const lv=LV(S.lv),m=MD(mode),brukt=new Set(),list=[];
  const kinds=bland(['fordel','fordel','maal','maal','gange','gange']);
  const deck={};for(const k in TPL)deck[k]=bland([...TPL[k]]);
  const forms=['del','divisor','dividend','gange'];
  for(let i=0;i<m.n;i++){
    const p=lag(lv,S.omr,{split:mode==='delopp'},brukt);
    if(mode==='tekst'){p.kind=kinds[i%kinds.length];p.tpl=deck[p.kind][0];deck[p.kind].push(deck[p.kind].shift());p.op=p.kind==='gange'?'·':':'}
    if(mode==='mangler')p.form=forms[i%4];
    list.push(p);
  }
  if(mode==='mangler')bland(list);
  P={mode,lv:lv.id,omr:S.omr,list,i:0,res:[],right:0};
  nyOppgave();scrollTo(0,0);
}
function nyOppgave(){
  const p=P.list[P.i];
  Object.assign(P,{p,tries:0,done:false,msg:'',cls:'',hint:false,blk:false,typed:'',must:false,
    stage:'op',opTries:0,st:0,vals:[null,null,null],err:false,valg:P.mode==='delopp'?splitValg(p):null});
  render();
}
function hdr(){
  const m=MD(P.mode),lv=LV(P.lv),o=OMR.find(x=>x.id===P.omr);
  return `<div class="phead"><button class="back" data-act="home">← Avslutt</button>
    <span class="small muted">${m.ikon} ${m.navn} · ${o.navn.toLowerCase()} · ${lv.sub}</span></div>
    <div class="prog" aria-label="Oppgave ${P.i+1} av ${P.list.length}">${P.list.map((_,i)=>`<i class="${P.res[i]||''}${i===P.i?' now':''}"></i>`).join('')}</div>`;
}
const padHTML=()=>`<div class="pad" role="group" aria-label="Tallknapper">${[7,8,9,4,5,6,1,2,3].map(d=>`<button data-k="${d}">${d}</button>`).join('')}<button data-k="del" aria-label="Slett">⌫</button><button data-k="0">0</button><button class="okk" data-k="ok">Sjekk</button></div>`;
const fbHTML=()=>`<p class="fb ${P.cls}" aria-live="polite">${P.msg||'&nbsp;'}</p>`;
const nesteBtn=()=>`<button class="btn pri big" data-act="next">${P.i===P.list.length-1?'Se resultatet':'Neste oppgave'} →</button>`;
const boxHTML=()=>`<span class="ansbox${P.done?' ok':''}">${P.typed||'?'}</span>`;

function fasit(p){
  if(P.mode==='mangler')return{del:p.q,divisor:p.d,dividend:p.a,gange:p.q}[p.form];
  if(P.mode==='tekst'&&p.op==='·')return p.a;
  return p.q;
}
function uttrykk(p,box){
  if(P.mode==='mangler')return{del:`${p.a} : ${p.d} = ${box}`,divisor:`${p.a} : ${box} = ${p.q}`,dividend:`${box} : ${p.d} = ${p.q}`,gange:`${box} · ${p.d} = ${p.a}`}[p.form];
  if(P.mode==='tekst'&&p.op==='·')return `${p.d} · ${p.q} = ${box}`;
  return `${p.a} : ${p.d} = ${box}`;
}
function hjelpHTML(p,full){
  if(P.mode==='mangler')return manglerHjelp(p,full);
  if(P.mode==='tekst'&&p.op==='·')return gangeStrategi(p.q,p.d,full);
  return strategi(p,full);
}

function render(){
  V='play';
  app.innerHTML=hdr()+`<section class="card play">${P.mode==='delopp'?rDelopp():rTall()}</section>`;
}
function rTall(){
  const p=P.p;let h='';
  if(P.mode==='tekst'){
    h+=`<div class="story"><span class="si" aria-hidden="true">${p.tpl[0]}</span><p>${p.tpl[1](p)}</p></div>`;
    if(P.stage==='op')return h+`<p class="ask"><b>Skal du dele eller gange?</b></p>${fbHTML()}
      <div class="choice"><button class="btn" data-top=":"><span class="s">:</span>Dele</button><button class="btn" data-top="·"><span class="s">·</span>Gange</button></div>`;
  }else h+=`<p class="ask">${P.mode==='mangler'?'Hvilket tall mangler?':'Regn i hodet:'}</p>`;
  h+=`<p class="bigq${P.mode==='tekst'?' mid':''}">${uttrykk(p,boxHTML())}</p>${fbHTML()}`;
  if(P.hint||P.must)h+=hjelpHTML(p,P.must);
  if(P.blk)h+=kakerHTML(p);
  if(P.done)return h+nesteBtn();
  const kanKake=!P.blk&&(P.mode==='hode'||(P.mode==='tekst'&&p.op===':'))&&p.q<=12&&p.a<=100;
  return h+padHTML()+`<div class="row">${P.hint||P.must?'':'<button class="btn" data-act="hint">💡 Hjelp</button>'}${kanKake?'<button class="btn" data-act="blk">🍪 Vis med kaker</button>':''}</div>`;
}
function rDelopp(){
  const p=P.p,{t,u,c,r}=delOpp(p);
  let h=`<p class="ask">Regn ut <b class="nowrap">${p.a} : ${p.d}</b> ved å dele opp ${p.a} i lette biter.</p>`;
  if(P.st===0){
    h+=barHTML(p,[],true)+`<p class="ask"><b>Hvilken oppdeling er lett å dele på ${p.d}?</b></p>${fbHTML()}
      <div class="choice c3">${P.valg.map((o,i)=>`<button class="btn" data-split="${i}" ${o.dis?'disabled':''}>${o.x} + ${o.y}</button>`).join('')}</div>`;
    if(P.hint){
      const m=[];for(let k=10;k*p.d<=p.a;k+=10)m.push(`${p.d} · ${k} = ${p.d*k}`);
      h+=`<div class="strat"><p class="small muted">Se etter tiertall i ${p.d}-gangen som er litt mindre enn ${p.a}. Begge bitene må gå opp i ${p.d}-gangen.</p><div class="hops">${m.map(x=>`<span class="hop">${x}</span>`).join('')}</div></div>`;
    }else h+=`<div class="row"><button class="btn" data-act="hint">💡 Hjelp</button></div>`;
    return h;
  }
  h+=barHTML(p,[P.vals[0],P.vals[1]]);
  const L=[[`${c} : ${p.d}`,t,'Første bit'],[`${r} : ${p.d}`,u,'Andre bit'],[`${t} + ${u}`,p.q,'Legg sammen']];
  h+='<div class="steps">';
  L.forEach(([q,ans,lbl],i)=>{const k=i+1;
    if(k<P.st||P.done)h+=`<div class="stp ok"><span class="lbl">${lbl}</span>${q} = ${ans}</div>`;
    else if(k===P.st)h+=`<div class="stp"><span class="lbl">${lbl}</span>${q} = ${boxHTML()}</div>`;
  });
  if(P.done)h+=`<div class="stp fin">${p.a} : ${p.d} = ${p.q}</div>`;
  h+='</div>'+fbHTML();
  if(P.done)return h+nesteBtn();
  if(P.hint||P.must)h+=stegHjelp(p,P.must);
  return h+padHTML()+(P.hint||P.must||P.st===3?'':`<div class="row"><button class="btn" data-act="hint">💡 Hjelp</button></div>`);
}
function stegHjelp(p,full){
  const {t,u,c,r}=delOpp(p);
  if(P.st===1)return `<div class="strat"><p class="small muted">Tenk uten nullen: ${c/10} : ${p.d} = ${full?t/10:'?'}. Sett nullen på igjen etterpå.</p>${full?`<div class="ln">${c} : ${p.d} = <b>${t}</b></div>`:''}</div>`;
  if(P.st===2)return `<div class="strat"><p class="small muted">Tell i ${p.d}-gangen til du kommer til ${r}. Hvor mange hopp?</p>${hopsHTML(p.d,u)}${full?`<div class="ln">${r} : ${p.d} = <b>${u}</b></div>`:''}</div>`;
  return `<div class="strat"><div class="ln">${t} + ${u} = <b>${p.q}</b></div></div>`;
}

/* ---------- svar ---------- */
function gullFor(p){return P.mode==='tekst'||P.mode==='delopp'||p.a>=100?2:1}
function riktig(first,gull){
  P.done=true;
  if(first){P.right++;P.res[P.i]='ok';window.Gull&&Gull.tjen(gull);P.msg=pick(ROS)}
  else{P.res[P.i]='half';P.msg=pick(ROS2)}
  P.cls='good';beep('ok');S.right++;save();
}
function sjekkTall(){
  const p=P.p,f=fasit(p);
  if(!P.typed){P.msg='Skriv svaret med tallknappene.';P.cls='info';return render()}
  const v=+P.typed;
  if(P.must){
    if(v===f){P.done=true;P.msg='Bra! Nå har du skrevet det riktig selv.';P.cls='good';beep('ok')}
    else{P.typed='';P.msg=`Svaret er ${f}. Skriv det inn.`;P.cls='info'}
    return render();
  }
  if(v===f){
    const first=P.tries===0&&P.opTries===0;
    riktig(first,gullFor(p));
    if(first&&!(P.mode==='tekst'&&p.op==='·'))P.msg+=` Sjekk: ${p.q} · ${p.d} = ${p.a}.`;
    return render();
  }
  P.tries++;P.res[P.i]='miss';beep('soft');P.typed='';
  if(P.tries>=2){P.must=true;P.msg=`Svaret er ${f}. Se hvordan under, og skriv svaret selv.`;P.cls='info';return render()}
  let m=v>f?'Ikke helt – svaret ditt er for stort. Prøv igjen!':'Ikke helt – svaret ditt er for lite. Prøv igjen!';
  if(P.mode!=='tekst'&&P.mode!=='mangler'&&v===p.a*p.d)m='Du har ganget! Her skal du dele. Prøv igjen.';
  if(P.mode==='tekst'&&p.op===':'&&v===p.a-p.d)m='Du har tatt minus. Her skal du dele. Prøv igjen.';
  P.msg=m;P.cls='oops';render();
}
function sjekkSteg(){
  const p=P.p,{t,u}=delOpp(p),f=[t,u,p.q][P.st-1];
  if(!P.typed){P.msg='Skriv svaret med tallknappene.';P.cls='info';return render()}
  const v=+P.typed;
  if(v===f){
    P.vals[P.st-1]=v;P.typed='';P.hint=false;P.must=false;P.tries=0;
    if(P.st===3){
      P.done=true;
      if(!P.err){P.right++;P.res[P.i]='ok';window.Gull&&Gull.tjen(2);P.msg=pick(ROS)+` Sjekk: ${p.q} · ${p.d} = ${p.a}.`}
      else{P.res[P.i]='half';P.msg=pick(ROS2)}
      P.cls='good';beep('ok');S.right++;save();
    }else{P.st++;P.msg=P.st===2?'Bra! Nå den andre biten.':'Bra! Legg sammen svarene.';P.cls='good';beep('tap')}
    return render();
  }
  if(P.must){P.typed='';P.msg=`Det er ${f}. Skriv det inn.`;P.cls='info';return render()}
  P.err=true;P.tries++;P.res[P.i]='miss';beep('soft');P.typed='';
  if(P.tries>=2){P.must=true;P.msg=`Det er ${f}. Skriv det inn, så går vi videre.`;P.cls='info';return render()}
  P.msg=v>f?'Ikke helt – for stort. Prøv igjen!':'Ikke helt – for lite. Prøv igjen!';P.cls='oops';render();
}
function velgSplit(i){
  const p=P.p,o=P.valg[i],d=p.d;
  if(o.ok){P.st=1;P.tries=0;P.hint=false;P.msg=`Riktig! Både ${o.x} og ${o.y} går opp i ${d}-gangen.`;P.cls='good';beep('tap');return render()}
  P.err=true;P.tries++;P.res[P.i]='miss';beep('soft');o.dis=true;
  const bad=o.x%d?o.x:o.y;
  if(P.tries>=2){const k=P.valg.find(v=>v.ok);P.st=1;P.tries=0;P.hint=false;
    P.msg=`${bad} kan ikke deles likt på ${d}. Vi bruker ${k.x} + ${k.y} – begge går opp i ${d}-gangen.`;P.cls='info';return render()}
  P.msg=`${bad} kan ikke deles likt på ${d}. Prøv en annen.`;P.cls='oops';render();
}
function velgRegneart(op){
  const p=P.p;
  if(op===p.op){P.stage='num';P.msg=P.opTries?FORKL[p.kind](p):'Riktig! Regn ut.';P.cls=P.opTries?'info':'good';beep('tap')}
  else{P.opTries++;beep('soft');P.res[P.i]='miss';
    if(P.opTries>=2){P.stage='num';P.msg=FORKL[p.kind](p);P.cls='info'}
    else{P.msg='Tenk en gang til: '+TENK[p.kind](p);P.cls='oops'}}
  render();
}

/* ---------- tastatur ---------- */
function tast(k){
  if(V!=='play'||!P||P.done)return;
  const num=P.mode==='delopp'?P.st>0:(P.mode!=='tekst'||P.stage==='num');
  if(!num)return;
  if(k==='ok')return P.mode==='delopp'?sjekkSteg():sjekkTall();
  if(k==='del'){P.typed=P.typed.slice(0,-1);return render()}
  if(P.typed.length<3){P.typed=(P.typed==='0'?'':P.typed)+k;beep('tap')}
  render();
}

/* ---------- resultat ---------- */
function resultat(){
  V='res';const m=MD(P.mode),n=P.list.length,st=stjerner(P.right/n),k=bkey(P.mode,P.lv,P.omr);
  const ny=st>(S.best[k]||0);if(ny)S.best[k]=st;S.rounds++;save();updTop();
  if(st>0)window.Gull&&Gull.bonus(st,'Runde ferdig!');
  const idx=LEVELS.findIndex(l=>l.id===P.lv),neste=LEVELS[idx+1];
  const tilStore=!neste&&P.omr==='sma';
  const tittel=st===3?'Kjempebra! 🏆':st===2?'Godt jobbet! 💪':st===1?'Bra innsats! 👍':'Fint at du øvde! 🌱';
  app.innerHTML=`<section class="card res">
    ${starsHTML(st,true)}
    <h1>${tittel}</h1>
    <p>${P.right} av ${n} riktige på første forsøk i «${m.navn}».${ny&&st?' Ny rekord på dette nivået!':''}</p>
    ${st===3&&neste?`<p class="muted">Klar for neste nivå? Prøv <b>${neste.navn.toLowerCase()}</b> (${neste.sub}).</p>`:st===3&&tilStore?'<p class="muted">Klar for <b>store tall</b>? Velg det øverst på forsiden.</p>':st<2?'<p class="muted">Tips: Se på «Slik deler du» – der går vi gjennom det steg for steg.</p>':''}
    <div class="row"><button class="btn pri big" data-act="again">Én runde til</button>${st===3&&neste?`<button class="btn big" data-act="nextlv">Neste nivå →</button>`:''}<button class="btn big" data-act="home">Til forsiden</button></div>
  </section>`;
  if(st>=2){confetti(st===3?140:70);beep('up')}
  scrollTo(0,0);
}

/* ---------- lær ---------- */
function nyDemo(){const d=rnd(2,5),q=rnd(2,6);return{a:d*q,d,q,n:0}}
function nyStor(){return{p:lag({d:[3,4,6,7,8]},'store',{split:true}),k:0}}
function delOppSteg(p){const {t,u,c,r}=delOpp(p);return[
  {txt:`${p.a} : ${p.d}. ${p.a} er et stort tall. Vi deler det opp i biter som er lette å dele på ${p.d}.`,hel:true,v:[]},
  {txt:`${p.d} · ${t} = ${c}. Derfor tar vi <b>${c}</b> først. Det er <b>${r}</b> igjen, så ${p.a} = ${c} + ${r}.`,v:[null,null]},
  {txt:`${c} : ${p.d} = <b>${t}</b>. Tenk ${c/10} : ${p.d} = ${t/10}, og sett på nullen.`,v:[t,null]},
  {txt:`${r} : ${p.d} = <b>${u}</b>. Det er gangetabellen baklengs.`,v:[t,u]},
  {txt:`Legg sammen: ${t} + ${u} = <b>${p.q}</b>. Så ${p.a} : ${p.d} = <b>${p.q}</b>.<br>Sjekk: ${p.q} · ${p.d} = ${p.a} ✔`,v:[t,u]},
]}
function demoHTML(D){
  const igjen=D.a-D.n*D.d,ferdig=D.n===D.q;
  const txt=ferdig?`Alle kakene er delt ut! Hvert dyr fikk <b>${D.q}</b> – det ble ${D.q} runder. <b>${D.a} : ${D.d} = ${D.q}</b>`
    :D.n===0?`Vi har ${D.a} kaker og ${D.d} dyr. Trykk «Del ut én runde» – da får hvert dyr én kake.`
    :`Runde ${D.n}: hvert dyr har ${D.n} kake${D.n>1?'r':''}. Det er ${igjen} kaker igjen.`;
  return `<div class="demo">
    <div class="pile" aria-label="${igjen} kaker igjen">${igjen?'<i class="ck"></i>'.repeat(igjen):'<span class="muted small">Tomt!</span>'}</div>
    <div class="plates">${Array.from({length:D.d},(_,i)=>`<div class="plate"><span class="pn" aria-hidden="true">${DYR[i]}</span><div class="pc">${'<i class="ck sm"></i>'.repeat(D.n)}</div></div>`).join('')}</div>
    <p class="soltxt" aria-live="polite">${txt}</p>
    <div class="row">${ferdig?'':'<button class="btn pri" data-act="rund">🍪 Del ut én runde</button>'}<button class="btn" data-act="nydemo">🔄 Nytt eksempel</button></div></div>`;
}
function laer(){
  V='laer';
  if(!L)L={demo:nyDemo(),stor:nyStor()};
  const s=delOppSteg(L.stor.p),k=L.stor.k,st=s[k];
  app.innerHTML=`<button class="back" data-act="home">← Tilbake</button>
  <section class="card"><h1>Slik deler du</h1>
    <ul class="tips" style="margin-top:10px">
      <li><b>Deling</b> er å fordele likt – eller å finne ut hvor mange ganger et tall går opp i et annet.</li>
      <li><b>:</b> betyr «delt på». 24 : 6 leses «24 delt på 6».</li>
      <li><b>Gange og dele hører sammen.</b> 4 · 6 = 24, så 24 : 6 = 4 og 24 : 4 = 6.</li>
      <li><b>Små tall:</b> Bruk gangetabellen baklengs. 56 : 7 – hva ganger 7 blir 56? 8!</li>
      <li><b>Store tall:</b> Del opp i lette biter. 144 : 6 = 120 : 6 + 24 : 6 = 20 + 4 = 24.</li>
      <li><b>Lure triks:</b> : 2 er å halvere. : 10 er å ta bort nullen. : 5 er det dobbelte av : 10 (60 : 5 = 6 · 2 = 12).</li>
      <li><b>Sjekk</b> alltid med gange: 24 · 6 = 144 ✔</li>
    </ul></section>
  <section class="card"><h2>Del ut kakene</h2><p class="muted small" style="margin:4px 0 10px">Hver runde får alle dyrene én kake. Antall runder er svaret.</p>${demoHTML(L.demo)}</section>
  <section class="card"><h2>Store tall: del opp</h2><p class="muted small" style="margin:4px 0 10px">Trykk «Neste steg» og se hvordan et stort stykke blir to lette.</p>
    <div class="sol">${barHTML(L.stor.p,st.v,st.hel)}<div class="soltxt" aria-live="polite">${st.txt}</div>
      <div class="solnav"><button class="btn" data-sol="-1" ${k===0?'disabled':''}>◀ Forrige</button><span class="cnt">Steg ${k+1} av ${s.length}</span><button class="btn pri" data-sol="1" ${k===s.length-1?'disabled':''}>Neste steg ▶</button></div></div>
    <div class="row" style="margin-top:10px"><button class="btn" data-act="nystor">🔄 Nytt eksempel</button></div></section>
  <section class="card"><h2>En familie</h2><p class="muted small" style="margin:4px 0 10px">Kan du ett av stykkene, kan du alle fire.</p>${familie({a:56,d:7,q:8})}</section>
  <div class="row"><button class="btn pri big" data-mode="delopp">🪜 Prøv å dele opp selv</button></div>`;
}

/* ---------- klikk ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-act]');if(!t||t.disabled)return;
  const d=t.dataset;
  if(d.omr){S.omr=d.omr;save();return home()}
  if(d.lv){S.lv=d.lv;save();return home()}
  if(d.mode){return start(d.mode)}
  if(d.k){return tast(d.k)}
  if(d.top&&P&&!P.done){return velgRegneart(d.top)}
  if(d.split!=null&&P&&!P.done){return velgSplit(+d.split)}
  if(d.sol&&L){L.stor.k=Math.max(0,Math.min(4,L.stor.k+(+d.sol)));return laer()}
  switch(d.act){
    case'home':return home();
    case'laer':L=null;scrollTo(0,0);return laer();
    case'rund':if(L.demo.n<L.demo.q){L.demo.n++;beep(L.demo.n===L.demo.q?'ok':'tap')}return laer();
    case'nydemo':L.demo=nyDemo();return laer();
    case'nystor':L.stor=nyStor();return laer();
    case'sound':S.sound=!S.sound;save();return updTop();
    case'theme':S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme];save();return applyTheme();
    case'hint':P.hint=true;P.tries=Math.max(P.tries,1);P.err=true;if(P.mode!=='delopp'){P.msg='Bruk hjelpen – og skriv svaret.';P.cls='info'}return render();
    case'blk':P.blk=true;P.tries=Math.max(P.tries,1);return render();
    case'next':if(P.i<P.list.length-1){P.i++;nyOppgave();scrollTo(0,0)}else resultat();return;
    case'again':return start(P.mode);
    case'nextlv':{const idx=LEVELS.findIndex(l=>l.id===P.lv);S.lv=LEVELS[idx+1].id;save();return start(P.mode)}
  }
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(V==='play'&&P){
    if(/^[0-9]$/.test(e.key)){e.preventDefault();return tast(e.key)}
    if(e.key==='Backspace'){e.preventDefault();return tast('del')}
    if(e.key==='Enter'&&!e.target.closest('button')){
      e.preventDefault();
      if(P.done)return document.querySelector('[data-act="next"]')?.click();
      return tast('ok');
    }
  }
});

applyTheme();updTop();home();
</script>
</body>
</html>
