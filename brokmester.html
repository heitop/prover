  document.getElementById('go-prog').onclick=progress;
  bindReset('reset-home','Nullstill');
  const nf=document.getElementById('nameform');if(nf)nf.onsubmit=e=>{e.preventDefault();const v=document.getElementById('nm0').value.trim();if(!v)return;S.name=v;save();home()};
  document.querySelectorAll('.tcard').forEach(b=>b.onclick=()=>startRound('topic',b.dataset.id));
}

function startRound(mode,id){
  let plan;
  if(mode==='test')plan=TOPICS.map(t=>t.id);
  else if(mode==='topic')plan=Array(8).fill(id);
  else{const f=focusTopic();plan=Array(6).fill(f);const rv=reviewTopics(f);plan.splice(2,0,rv[0]||f);plan.splice(6,0,rv[1]||f)}
  round={mode,topic:id,plan,i:0,results:[],extra:0,intro:new Set(),start:Object.fromEntries(TOPICS.map(t=>[t.id,Math.floor(S.skills[t.id].s)])),starsStart:S.stars};
  nextTask()}

function nextTask(){
  if(round.i>=round.plan.length)return endRound();
  const id=round.plan[round.i];
  // introside: alltid før første oppgave i runden, og før et repetisjonstema han aldri har sett
  if(round.mode!=='test'&&round.mode!=='lyn'&&!round.intro.has(id)&&(round.i===0||!S.skills[id].lesson)){
    round.intro.add(id);const first=!S.skills[id].lesson;S.skills[id].lesson=true;save();return showLesson(id,first)}
  const L=chooseLevel(id,round.mode);let task,n=0;
  do{task=TOPIC[id].gen(L);n++}while(task.key===lastKey&&n<8);lastKey=task.key;
  task.maxAttempts=round.mode==='test'||round.mode==='lyn'?1:(task.maxAttempts||3);
  cur={topic:id,level:L,task,wrong:0,paid:0,nudges:0,shown:0,done:false};
  if(round.mode!=='test'&&round.mode!=='lyn'&&S.skills[id].n<3&&L===1&&task.hints.length)cur.shown=1;
  renderTask()}

const HOWTO=`<ul><li>Skriv svaret og trykk <b>Sjekk svar</b>, eller trykk på riktig alternativ.</li><li>Du har opptil 3 forsøk. Bommer du, får du et tips og kan prøve igjen.</li><li>Står du fast, trykk <b>Tips</b>.</li><li>Riktig på første forsøk gir 3 stjerner. Med tips eller flere forsøk får du litt færre. Fem riktige på rad gir en ekstra stjerne.</li><li>Går det bra, blir oppgavene vanskeligere. Butter det, blir de enklere.</li><li>Reglene finner du igjen i <b>Husk-kortet</b> nederst i hver oppgave.</li></ul>`;
function showLesson(id,first){
  const tp=TOPIC[id],k=S.skills[id],I=INTRO[id],pos=TOPICS.indexOf(tp)+1,[st]=status(id);
  const where=k.n?`Du er på nivå ${Math.floor(k.s)} av 5 · ${st}`:'Du starter på nivå 1';
  window.scrollTo(0,0);
  app.innerHTML=`${topbar()}<main class="wrap"><article class="card lesson intro">
   <div class="tmeta"><span class="chip${first?' go':''}">${first?'Nytt tema':`Tema ${pos} av ${TOPICS.length}`}</span><span class="lvl">${pips(k.n?Math.floor(k.s):1)} ${where}</span></div>
   <h2>${tp.name}</h2>
   <p class="about">${I.about()}</p>
   <section><h3>Reglene</h3>${rulesHtml(id)}</section>
   <section><h3>Eksempel</h3>${I.ex()}</section>
   <p class="watch"><b>Pass på:</b> ${I.watch()}</p>
   <details class="lesson howto"${S.total===0?' open':''}><summary>Slik spiller du</summary>${HOWTO}</details>
   <div class="btns"><button class="btn pri" id="ready">Start oppgavene</button><button class="btn ghost" id="quit">Tilbake</button></div></article></main>`;
  bindTop();document.getElementById('ready').onclick=nextTask;document.getElementById('quit').onclick=()=>{if(round.results.length)endRound();else home()};document.getElementById('ready').focus({preventScroll:true})}

function inputHtml(inp){
  if(inp.inline)return '';
  const box=(id,lbl,cls='',mode='numeric')=>`<input id="${id}" class="box ${cls}" inputmode="${mode}" autocomplete="off" aria-label="${lbl}">`;
  switch(inp.type){
    case 'frac':return `<div class="ans">${inp.mixed?box('a-w','Hele','w'):''}<span class="fin">${box('a-n','Teller')}<span class="fbar"></span>${box('a-d','Nevner')}</span></div>${inp.mixed?'<p class="note">La feltet for hele stå tomt hvis du ikke trenger det.</p>':''}`;
    case 'int':return `<div class="ans">${box('a-i','Svar','wide')}${inp.unit?`<span class="unit">${inp.unit}</span>`:''}</div>`;
    case 'dec':return `<div class="ans">${box('a-i','Svar som desimaltall','wide','decimal')}</div>`;
    case 'pct':return `<div class="ans">${box('a-i','Svar i prosent','wide','decimal')}<span class="unit">%</span></div>`;
    case 'choice':return `<div class="choices">${inp.options.map((o,i)=>`<button type="button" class="choice${o.txt?' txt':''}" data-i="${i}">${o.html}</button>`).join('')}</div>`}
  return ''}

function renderTask(){
  const t=cur.task,tp=TOPIC[cur.topic],test=round.mode==='test',lyn=round.mode==='lyn';
  const dots=lyn?'':round.plan.map((_,i)=>{const r=round.results[i];return `<span class="dot ${r?(r.score>=0.8?'g':r.score>0?'y':'r'):i===round.i?'cur':''}"></span>`}).join('');
  app.innerHTML=`${topbar()}<main class="wrap">
   <div class="taskhead"><button class="btn ghost" id="quit">Avslutt</button><div class="dots">${dots}</div>${lyn?`<span class="stat">${round.lynOk} riktige</span>`:''}</div>
   ${lyn?'<div class="timer"><i id="tm" style="width:100%"></i></div>':''}
   <article class="card" id="tcard">
    <div class="tmeta"><span class="chip">${tp.name}</span>${test?'<span class="chip go">Øveprøve</span>':`<span class="lvl">${pips(cur.level)} Nivå ${cur.level}</span>`}</div>
    <p class="prompt">${t.prompt}</p>
    ${t.visual?`<div class="visual">${t.visual}</div>`:''}
    ${t.expr||''}
    <form id="af" autocomplete="off" class="lesson" style="gap:14px">
     ${inputHtml(t.input)}
     <div class="hintbox" id="hb"></div>
     <div class="fb" id="fb" aria-live="polite" hidden></div>
     ${lyn?'<div class="flash" id="flash" aria-live="polite"></div>':''}
     <div class="btns" id="btns"></div>
    </form>
    ${test||lyn?'':`<details class="lesson"><summary>Husk-kort: ${tp.name}</summary>${memoHtml(cur.topic)}</details>`}
   </article></main>`;
  bindTop();
  document.getElementById('quit').onclick=()=>{stopLyn();if(round.results.length&&round.mode!=='lyn')endRound();else home()};
  document.getElementById('af').onsubmit=e=>{e.preventDefault();if(cur.done){goNext();return}submit(readRaw())};
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(cur.done||b.disabled)return;submit({i:+b.dataset.i},b)});
  drawHints();drawButtons();
  const first=document.querySelector('#a-w,#a-n,#a-i');
  // hopp videre fra teller til nevner med Enter er naturlig: Enter sender skjemaet, Tab flytter.
  if(first){const ws=document.getElementById('a-w');(ws?document.getElementById('a-n'):first).focus({preventScroll:true})}
  if(lyn)updTimer()}

function readRaw(){const g=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
  return cur.task.input.type==='frac'?{w:g('a-w'),n:g('a-n'),d:g('a-d')}:{v:g('a-i')}}
function drawHints(){const hb=document.getElementById('hb');if(!hb)return;
  hb.innerHTML=cur.task.hints.slice(0,cur.shown).map((h,i)=>{const o=typeof h==='string'?{t:h}:h;return `<div class="hint"><b class="h">Tips ${i+1}</b>${o.t}${o.v?`<div class="visual sm">${o.v}</div>`:''}</div>`}).join('')}
function drawButtons(){const b=document.getElementById('btns');if(!b)return;const t=cur.task,test=round.mode==='test',lyn=round.mode==='lyn',choice=t.input.type==='choice';
  if(cur.done){b.innerHTML=`<button class="btn pri" type="submit" id="next">${round.i+1>=round.plan.length&&!lyn?'Se resultatet':'Neste oppgave'}</button>`;document.getElementById('next').focus({preventScroll:true});return}
  const left=t.maxAttempts-cur.wrong,hl=t.hints.length-cur.shown;
  b.innerHTML=`${choice?'':'<button class="btn pri" type="submit">Sjekk svar</button>'}
   ${test||lyn?'':`<button class="btn" type="button" id="hint" ${hl?'':'disabled'}>${hl?`Tips (${hl} igjen)`:'Ingen flere tips'}</button>`}
   <span class="spacer"></span>${test||lyn||t.maxAttempts<2?'':`<span class="tries" title="Forsøk igjen">${[...Array(t.maxAttempts)].map((_,i)=>`<i class="${i<cur.wrong?'used':''}"></i>`).join('')} forsøk</span>`}`;
  const h=document.getElementById('hint');if(h)h.onclick=()=>{if(cur.shown<t.hints.length){cur.shown++;cur.paid++;drawHints();drawButtons()}}}
function showFb(kind,big,html=''){const f=document.getElementById('fb');if(!f)return;f.hidden=false;f.className='fb '+kind;f.innerHTML=(big?`<span class="big">${big}</span>`:'')+html}
function shake(){const c=document.getElementById('tcard');if(!c||reduced())return;c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}

function mistake(code){if(!code||code==='exact')return;const m=S.mist[code]||(S.mist[code]={n:0,topic:cur.topic});m.n++;m.topic=cur.topic}

function submit(raw,btn){
  if(cur.done)return;
  const res=check(cur.task,raw);
  if(res.st==='invalid'){showFb('info','',res.msg);return}
  if(round.mode==='test')return recordTest(res,raw);
  if(round.mode==='lyn')return recordLyn(res);
  if(res.st==='ok'){if(btn)btn.classList.add('good');return finish(true)}
  if(res.st==='nudge'){cur.nudges++;if(res.code)mistake(res.code);
    showFb('warn','Nesten!',res.msg+(cur.nudges>=2?` <p>Svaret så enkelt som mulig er ${answerText(cur.task)}.</p>`:''));return}
  cur.wrong++;mistake(res.code);if(btn){btn.classList.add('bad');btn.disabled=true}
  if(cur.wrong>=cur.task.maxAttempts)return finish(false);
  beep('bad');shake();
  let tipNote='';if(cur.shown<cur.task.hints.length){cur.shown++;drawHints();tipNote=' Se tipset under.'}
  const left=cur.task.maxAttempts-cur.wrong;
  const why=res.msg?res.msg+' ':(tipNote?'':'Les tipset en gang til, eller åpne husk-kortet nederst. ');
  showFb('bad','Ikke helt',`${why}${tipNote.trim()} Prøv igjen, du har ${left} forsøk igjen.`);
  drawButtons();
  const first=document.querySelector('#a-n,#a-i');if(first)first.select&&first.select()}

const PRAISE=['Riktig!','Helt riktig!','Sterkt!','Der satt den!','Knallbra!','Rett i blinken!','Sånn skal det gjøres!'];
function finish(ok){
  cur.done=true;const k=S.skills[cur.topic],L=cur.level;
  let sc=0;if(ok){sc=cur.wrong===0?1:cur.wrong===1?0.5:0.3;if(cur.wrong===0&&cur.paid>0)sc=L<=2?0.8:0.6;if(cur.nudges>0)sc=Math.min(sc,cur.nudges>=2?0.6:0.85)}
  const before=Math.floor(k.s),delta=sc>=1?0.45:sc>=0.8?0.2:sc>=0.6?0.1:sc>=0.5?0:sc>=0.3?-0.2:-0.5;
  k.s=Math.max(1,Math.min(5.99,k.s+delta));k.n++;k.hist.push(sc);if(k.hist.length>10)k.hist.shift();k.last=S.total;k.fails=sc>=0.5?0:k.fails+1;
  S.total++;touchDay();S.today++;
  if(sc>=0.8){S.streak++;S.best=Math.max(S.best,S.streak)}else if(sc<0.5)S.streak=0;
  let st=Math.round(sc*3);if(S.streak>=5&&sc>=0.8)st+=1;S.stars+=st;
  save();updStats();
  round.results[round.i]={topic:cur.topic,level:L,score:sc,stars:st};
  const after=Math.floor(k.s);
  if(ok){beep('ok');window.Gull&&Gull.tjen(sc>=0.8?2:1);
    const big=sc>=1?pick(PRAISE):sc>=0.8?'Riktig! Tipset hjalp.':'Riktig! Bra at du ikke ga deg.';
    showFb('ok',big,`<p>+${st} ${st===1?'stjerne':'stjerner'}${S.streak>=3?` · ${S.streak} på rad!`:''}</p><div class="sol"><b>Slik tenker du:</b> ${cur.task.solution}</div>`);
    if(S.streak>0&&S.streak%5===0){confetti(70)}}
  else{beep('bad');showFb('sol','Her er løsningen',`<div class="sol">${cur.task.solution}</div><p class="small muted" style="margin-top:8px">Les gjennom den. Du får en lignende oppgave litt senere.</p>`);
    if(round.mode!=='test'&&round.extra<2){round.plan.push(cur.topic);round.extra++}}
  if(after>before){setTimeout(()=>{toast(`Nivå opp! ${TOPIC[cur.topic].name}: nivå ${after}`);beep('up');confetti()},350)}
  if(S.today===S.goal)setTimeout(()=>{toast('Dagens mål er nådd!');confetti(120)},700);
  checkBadges();save();
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  document.querySelectorAll('#af input').forEach(i=>i.readOnly=true);
  drawButtons()}
function goNext(){round.i++;nextTask()}

function rawHtml(raw){if(raw.i!==undefined)return cur.task.input.options[raw.i].html;if(raw.v!==undefined)return esc(raw.v)+(cur.task.input.type==='pct'?' %':'');
  if(raw.n||raw.d)return (raw.w?num(esc(raw.w)):'')+fr(esc(raw.n),esc(raw.d));return num(esc(raw.w||''))}
function recordTest(res,raw){
  const ok=res.st==='ok'||res.st==='nudge',k=S.skills[cur.topic];
  k.n++;k.hist.push(ok?1:0);if(k.hist.length>10)k.hist.shift();k.s=Math.max(1,Math.min(5.99,k.s+(ok?0.3:-0.4)));k.last=S.total;S.total++;touchDay();S.today++;
  if(ok){S.stars+=2;window.Gull&&Gull.tjen(2)}else mistake(res.code);
  round.results[round.i]={topic:cur.topic,level:cur.level,score:ok?1:0,ok,given:rawHtml(raw),task:cur.task,note:res.st==='nudge'?'Riktig verdi, men husk å skrive svaret så enkelt som mulig.':''};
  save();round.i++;nextTask()}

// ----- lynrunde -----
function startLyn(){const ids=TOPICS.filter(t=>S.skills[t.id].n>=3).map(t=>t.id);
  round={mode:'lyn',plan:[],i:0,results:[],ids,lynOk:0,lynN:0,end:Date.now()+60000};
  lynTimer=setInterval(updTimer,250);nextLyn()}
function nextLyn(){const id=pick(round.ids);round.plan[round.i]=id;const L=chooseLevel(id,'lyn');let task,n=0;
  do{task=TOPIC[id].gen(L);n++}while((task.key===lastKey||task.input.type==='choice'&&task.input.options.length>3&&false)&&n<8);lastKey=task.key;task.maxAttempts=1;
  cur={topic:id,level:L,task,wrong:0,paid:0,nudges:0,shown:0,done:false};renderTask()}
function updTimer(){if(!round||round.mode!=='lyn')return;const left=Math.max(0,round.end-Date.now()),e=document.getElementById('tm');if(e)e.style.width=(left/600)+'%';if(left<=0)endLyn()}
function stopLyn(){if(lynTimer){clearInterval(lynTimer);lynTimer=null}}
function recordLyn(res){const ok=res.st==='ok'||res.st==='nudge';round.lynN++;
  const fl=document.getElementById('flash');
  if(ok){round.lynOk++;window.Gull&&Gull.tjen(1);S.streak++;S.best=Math.max(S.best,S.streak);S.stars+=1;beep('ok');if(fl){fl.className='flash ok';fl.textContent='Riktig! +1'}}
  else{S.streak=0;beep('bad');mistake(res.code);if(fl){fl.className='flash bad';fl.innerHTML='Svaret var '+answerText(cur.task)}}
  S.total++;touchDay();S.today++;save();updStats();cur.done=true;
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  setTimeout(()=>{if(round&&round.mode==='lyn'&&Date.now()<round.end){round.i++;nextLyn()}},ok?550:1500)}
function endLyn(){stopLyn();if(!round||round.mode!=='lyn')return;const r=round;round=null;const rec=r.lynOk>S.lynBest;if(rec)S.lynBest=r.lynOk;checkBadges();save();
  app.innerHTML=`${topbar()}<main class="wrap"><article class="card"><h1>Tiden er ute!</h1>
   <div class="bigstat"><div class="bs"><b>${r.lynOk}</b><span>riktige</span></div><div class="bs"><b>${r.lynN}</b><span>forsøkt</span></div><div class="bs"><b>${S.lynBest}</b><span>rekord</span></div></div>
   <p>${rec?'Ny rekord! Kan du slå den?':r.lynOk>=S.lynBest-2?'Nesten rekord. Ett forsøk til?':'Lynrunden blir lettere jo mer du øver i Smart øving.'}</p>
   <div class="btns"><button class="btn pri" id="again">Prøv igjen</button><button class="btn" id="home">Til start</button></div></article></main>`;
  bindTop();document.getElementById('again').onclick=startLyn;document.getElementById('home').onclick=home;if(rec){beep('up');confetti(120);window.Gull&&Gull.bonus(3,'Ny rekord!')}}

// ----- oppsummering -----
function endRound(){
  const r=round;window.scrollTo(0,0);
  if(r.mode==='test'){
    const res=r.results.filter(Boolean),ok=res.filter(x=>x.ok).length,pct=Math.round(100*ok/Math.max(1,res.length));
    const weak=[...new Set(res.filter(x=>!x.ok).map(x=>x.topic))];
    S.tests.push({date:new Date().toISOString().slice(0,10),ok,n:res.length,pct,weak});checkBadges();save();
    app.innerHTML=`${topbar()}<main class="wrap"><article class="card"><h1>Øveprøve ferdig</h1>
     <div class="bigstat"><div class="bs"><b>${ok}/${res.length}</b><span>riktige</span></div><div class="bs"><b>${pct} %</b><span>score</span></div><div class="bs"><b>${weak.length}</b><span>tema å øve på</span></div></div>
     <p>${pct>=80?'Dette er sterkt. Du er godt forberedt!':pct>=50?'Godt jobbet. Øv litt mer på temaene under, så sitter det.':'Bra at du tok prøven. Nå vet vi hva du skal øve på, og Smart øving tar det derfra.'}</p>
     ${weak.length?`<div class="list">${weak.map(id=>`<div class="li"><span>${TOPIC[id].name}</span><button class="btn" data-id="${id}">Øv på dette</button></div>`).join('')}</div>`:''}
     <h3>Gå gjennom svarene</h3><div class="list">${res.map((x,i)=>`<details class="rev"><summary><span>${i+1}. ${TOPIC[x.topic].name}</span><span class="mark ${x.ok?'ok':'bad'}">${x.ok?'Riktig':'Feil'}</span></summary>
       <div class="inner"><p>${x.task.prompt}</p>${x.task.visual?`<div class="visual">${x.task.visual}</div>`:''}${(x.task.expr||'').replace(/<input[^>]*>/,'?')}<p><b>Ditt svar:</b> ${x.given}</p>${x.note?`<p class="small">${x.note}</p>`:''}<div class="sol"><b>Løsning:</b> ${x.task.solution}</div></div></details>`).join('')}</div>
     <div class="btns"><button class="btn pri" id="smart">Øv på det du trenger</button><button class="btn" id="home">Til start</button></div></article></main>`;
    bindTop();document.getElementById('smart').onclick=()=>startRound('smart');document.getElementById('home').onclick=home;
    document.querySelectorAll('.li .btn').forEach(b=>b.onclick=()=>startRound('topic',b.dataset.id));
    window.Gull&&Gull.bonus(pct>=80?5:pct>=50?2:0,'Øveprøve ferdig!');if(pct>=80){confetti(140);beep('up')}return}
  const res=r.results.filter(Boolean),first=res.filter(x=>x.score>=1).length,good=res.filter(x=>x.score>=0.5).length,stars=S.stars-r.starsStart;
  const acc=good/Math.max(1,res.length);
  const changes=[...new Set(res.map(x=>x.topic))].map(id=>({id,a:r.start[id],b:Math.floor(S.skills[id].s)}));
  app.innerHTML=`${topbar()}<main class="wrap"><article class="card"><h1>${acc>=0.8?'Runden sitter!':acc>=0.5?'Godt jobbet!':'Tøff runde, godt kjempet'}</h1>
   <div class="bigstat"><div class="bs"><b>${first}/${res.length}</b><span>riktig på første forsøk</span></div><div class="bs"><b>+${stars}</b><span>stjerner</span></div><div class="bs"><b>${S.best}</b><span>beste rekke</span></div></div>
   <p>${acc>=0.8?'Neste runde blir litt tøffere.':acc>=0.5?'Du er på vei. Spillet justerer seg etter deg.':'Det er sånn man lærer. Neste runde blir litt enklere, og tipsene er der hvis du trenger dem.'}</p>
   <div class="list">${changes.map(c=>`<div class="li"><span>${TOPIC[c.id].name}</span><span>${pips(c.b)} ${c.b>c.a?`<span class="up">Nivå ${c.a} → ${c.b}</span>`:`Nivå ${c.b}`}</span></div>`).join('')}</div>
   <div class="btns"><button class="btn pri" id="again">Ny runde</button><button class="btn" id="home">Til start</button></div></article></main>`;
  bindTop();document.getElementById('again').onclick=()=>startRound(r.mode,r.topic);document.getElementById('home').onclick=home;
  if(res.length>=3)window.Gull&&Gull.bonus(acc>=0.8?3:1,'Runde ferdig!');if(acc>=0.8){confetti(100);beep('up')}}

// ----- fremgang -----
function progress(){
  window.scrollTo(0,0);
  const mist=Object.entries(S.mist).sort((a,b)=>b[1].n-a[1].n).slice(0,8);
  const rows=TOPICS.map(t=>{const k=S.skills[t.id],m=mastery(t.id),h=k.hist.slice(-10),acc=h.length?Math.round(100*h.filter(x=>x>=0.8).length/h.length):null,[st,cl]=status(t.id);
    return `<tr><td>${t.name}</td><td>${k.n?pips(Math.floor(k.s)):'–'}</td><td class="n">${m??'–'}${m!==null?' %':''}</td><td class="n">${k.n}</td><td class="n">${acc??'–'}${acc!==null?' %':''}</td><td><span class="chip ${cl}">${st}</span></td></tr>`}).join('');
  app.innerHTML=`${topbar()}<main class="wrap"><article class="card"><h1>Fremgang</h1>
   <p class="muted small">Mestring kombinerer nivået (1–5) med hvor ofte svarene var riktige på første forsøk de siste gangene. «Riktig første gang» gjelder de 10 siste oppgavene i temaet.</p>
   <div class="tbl"><table><thead><tr><th>Tema</th><th>Nivå</th><th style="text-align:right">Mestring</th><th style="text-align:right">Oppgaver</th><th style="text-align:right">Riktig første gang</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
   <h3>Typiske feil</h3>
   ${mist.length?`<div class="list">${mist.map(([c,m])=>`<div class="li"><span>${MISTAKES[c]?MISTAKES[c].label:c}<br><span class="small muted">${TOPIC[m.topic]?TOPIC[m.topic].name:''}</span></span><b>${m.n}×</b></div>`).join('')}</div>`:'<p class="muted">Ingen ennå. Når du svarer feil på en typisk måte, dukker det opp her.</p>'}
   <h3>Øveprøver</h3>
   ${S.tests.length?`<div class="list">${S.tests.slice(-8).reverse().map(x=>`<div class="li"><span>${x.date}</span><span>${x.ok}/${x.n} (${x.pct} %)${x.weak.length?` · øv på: ${x.weak.map(id=>TOPIC[id].name).join(', ')}`:''}</span></div>`).join('')}</div>`:'<p class="muted">Ingen øveprøver tatt ennå.</p>'}
   <h3>Innstillinger</h3>
   <div class="row"><label for="nm">Navn</label><input class="txt" id="nm" value="${esc(S.name)}" maxlength="20"><label for="gl">Dagsmål</label><input class="txt" id="gl" type="number" min="3" max="50" value="${S.goal}" style="width:5em"><button class="btn" id="savenm">Lagre</button></div>
   <h3>Flytt fremgangen til en annen maskin</h3>
   <p class="small muted">Fremgangen lagres i denne nettleseren. Kopier koden, og lim den inn på den andre maskinen.</p>
   <div class="row"><button class="btn" id="cp">Kopier fremgangskode</button></div>
   <textarea id="code" aria-label="Fremgangskode" placeholder="Lim inn en fremgangskode her …"></textarea>
   <div class="row"><button class="btn" id="imp">Hent fremgang fra koden</button><span class="spacer" style="flex:1"></span><button class="btn ghost" id="reset">Nullstill alt</button></div>
   <div class="btns"><button class="btn pri" id="home">Til start</button></div></article></main>`;
  bindTop();
  document.getElementById('home').onclick=home;
  document.getElementById('savenm').onclick=()=>{S.name=document.getElementById('nm').value.trim();S.goal=Math.max(3,Math.min(50,+document.getElementById('gl').value||10));save();toast('Lagret')};
  document.getElementById('cp').onclick=()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const ta=document.getElementById('code');ta.value=code;
    const done=()=>toast('Koden er kopiert');try{navigator.clipboard.writeText(code).then(done,()=>{ta.select();toast('Merk teksten og kopier den')})}catch(e){ta.select();toast('Merk teksten og kopier den')}};
  document.getElementById('imp').onclick=()=>{try{const x=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('code').value.trim()))));if(!x.skills)throw 0;localStorage.removeItem(KEY);S=Object.assign(fresh(),x);save();toast('Fremgangen er hentet');progress()}catch(e){toast('Koden virker ikke. Sjekk at hele koden er med.')}};
  bindReset('reset','Nullstill alt')}
function bindReset(id,label){const b=document.getElementById(id);if(!b)return;let armed=false;
  b.onclick=()=>{if(!armed){armed=true;b.textContent='Sikker? Trykk igjen for å slette alt';b.classList.add('danger');
      setTimeout(()=>{armed=false;if(document.body.contains(b)){b.textContent=label;b.classList.remove('danger')}},4000);return}
    const nm=S.name;S=fresh();S.name=nm;save();toast('Alt er nullstilt. Lykke til på nytt!');home()}}

// ----- tastatur: Enter går videre når oppgaven er ferdig -----
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&cur&&cur.done&&round&&round.mode!=='lyn'&&!['TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();goNext()}});

// ----- oppstart -----
function boot(data){if(data&&data.S&&data.S.skills)S=data.S;home()}
try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
