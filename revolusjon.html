<style>
/* Fransk blått og gull på pergament. Rødt bare i trikoloren – feil vises i varm korall. */
:root{
  --bg:#f6f1e7; --dot:#ebe2d0; --card:#fffdf8; --card2:#f2eadb; --line:#e3d7c1;
  --ink:#1e2230; --muted:#5f6676;
  --pri:#1f3d7a; --pri-ink:#ffffff; --pri-soft:#e1e8f5;
  --gold:#b48a1e; --gold-soft:#f8ecc8; --gold-ink:#4d3a06;
  --rouge:#c0392b;
  --coral:#b9532e; --coral-soft:#fbe3d8;
  --ok:#23804e; --ok-soft:#dcf2e4;
  --lv0:#ebe3d3; --lv1:#d8e1f2; --lv2:#93abd8; --lv3:#1f3d7a; --lv3-ink:#ffffff;
  --t-konge:#f3dc8f; --t-forste:#e6d8f0; --t-andre:#d9e4f5; --t-tredje:#eedfc8;
  --fd:"Playfair Display",Georgia,serif;
  --fb:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#12151c; --dot:#1b2029; --card:#1b2029; --card2:#252c37; --line:#323b48;
  --ink:#eef1f5; --muted:#a3acb8;
  --pri:#8fb0ec; --pri-ink:#0c1a33; --pri-soft:#1d2c47;
  --gold:#e3bd55; --gold-soft:#3a3016; --gold-ink:#f7e2a6;
  --rouge:#f07b6e;
  --coral:#f0a07f; --coral-soft:#3d261d;
  --ok:#62d394; --ok-soft:#15331f;
  --lv0:#29313b; --lv1:#1f3352; --lv2:#38598f; --lv3:#8fb0ec; --lv3-ink:#0c1a33;
  --t-konge:#4a3d17; --t-forste:#3a2d47; --t-andre:#22344f; --t-tredje:#43341f;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151c; --dot:#1b2029; --card:#1b2029; --card2:#252c37; --line:#323b48;
    --ink:#eef1f5; --muted:#a3acb8;
    --pri:#8fb0ec; --pri-ink:#0c1a33; --pri-soft:#1d2c47;
    --gold:#e3bd55; --gold-soft:#3a3016; --gold-ink:#f7e2a6;
    --rouge:#f07b6e;
    --coral:#f0a07f; --coral-soft:#3d261d;
    --ok:#62d394; --ok-soft:#15331f;
    --lv0:#29313b; --lv1:#1f3352; --lv2:#38598f; --lv3:#8fb0ec; --lv3-ink:#0c1a33;
    --t-konge:#4a3d17; --t-forste:#3a2d47; --t-andre:#22344f; --t-tredje:#43341f;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--fb);font-size:1.1rem;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.6px);background-size:22px 22px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.12rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.92rem}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{background:none;border:0;padding:4px 0;font-family:var(--fd);font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:10px;color:var(--pri)}
.tri{display:inline-flex;width:34px;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line);flex:none}
.tri i{flex:1}
.tri i:nth-child(1){background:#1f3d7a} .tri i:nth-child(2){background:#fff} .tri i:nth-child(3){background:#c0392b}
.stats{display:flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;display:inline-grid;place-items:center;padding:0;font-size:1.1rem}

.wrap{max-width:760px;margin:0 auto;padding:16px 16px 64px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px 18px;font-weight:700;min-height:50px;transition:transform .08s;text-align:center}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:transparent}
.btn.big{font-size:1.15rem;padding:14px 22px;min-height:58px}
.btn[disabled]{opacity:.4;cursor:default}
.back{align-self:flex-start;background:none;border:0;color:var(--pri);font-weight:700;padding:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 160px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 0;font-size:.95rem}

/* forside */
.hero{display:flex;flex-direction:column;gap:8px}
.kicker{font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:.85rem}
.motto{font-family:var(--fd);font-style:italic;color:var(--muted);font-size:1.1rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:transparent}
.prog{display:flex;flex-direction:column;gap:10px}
.progtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{border:0;border-radius:10px;padding:5px 10px;font-weight:700;font-size:.92rem;background:var(--lv0)}
.lv1{background:var(--lv1)} .lv2{background:var(--lv2)} .lv3{background:var(--lv3);color:var(--lv3-ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;background:var(--lv0)}
.step{display:flex;flex-direction:column;gap:10px}
.stephead{display:flex;align-items:center;gap:10px}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-weight:700}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mode{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;transition:transform .1s,border-color .1s;min-height:76px}
.mode:hover{border-color:var(--pri);transform:translateY(-1px)}
.mode .ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--pri-soft);display:grid;place-items:center;font-size:1.5rem}
.mode b{font-weight:700;font-size:1.05rem;display:block;line-height:1.2}
.mode small{display:block;color:var(--muted);font-size:.88rem;line-height:1.3}
.rec{display:inline-block;font-size:.75rem;font-weight:700;color:var(--gold-ink);background:var(--gold-soft);border-radius:999px;padding:1px 8px;margin-top:3px}
.adv{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--pri) 0%,color-mix(in srgb,var(--pri) 70%,#000) 100%);color:var(--pri-ink);border-radius:20px;padding:16px 18px;text-decoration:none}
.adv .ic{font-size:2.2rem}
.adv b{font-family:var(--fd);font-size:1.2rem;display:block}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px}
.qhead .x{flex:none}
.bar{flex:1;height:12px;border-radius:999px;background:var(--lv0);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pri);border-radius:999px;transition:width .3s}
.qcount{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
.qtitle{font-weight:700;color:var(--muted)}
.qcard{display:flex;flex-direction:column;gap:14px;padding:22px 18px}
.qlabel{font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.82rem}
.qbig{font-family:var(--fd);font-weight:700;font-size:2rem;line-height:1.2}
.qbig.sent{font-family:var(--fb);font-size:1.35rem;font-weight:700}
.qsub{color:var(--muted);font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{position:relative;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px 12px 40px;text-align:left;font-weight:700;font-size:1.05rem;min-height:58px;transition:border-color .1s,background .1s}
.opt:hover{border-color:var(--pri)}
.opt kbd{position:absolute;left:12px;top:50%;transform:translateY(-50%);font:700 .8rem var(--fb);color:var(--muted);background:var(--card2);border-radius:6px;padding:1px 6px}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--coral);background:var(--coral-soft)}
.opt[disabled]{cursor:default}
.wform{display:flex;gap:10px}
.wform input{flex:1;min-width:0;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:1.25rem;font-weight:700}
.wform input:focus{outline:none;border-color:var(--pri)}
.wform input.good{border-color:var(--ok);background:var(--ok-soft)}
.wform input.bad{border-color:var(--coral);background:var(--coral-soft)}
.fb{border-radius:16px;padding:0;display:flex;flex-direction:column;gap:6px}
.fb:not(:empty){padding:14px 16px}
.fb.ok{background:var(--ok-soft)}
.fb.almost{background:var(--gold-soft)}
.fb.wrong{background:var(--coral-soft)}
.fb .head{font-family:var(--fd);font-weight:700;font-size:1.25rem}
.fb.ok .head{color:var(--ok)} .fb.wrong .head{color:var(--coral)} .fb.almost .head{color:var(--gold-ink)}
.fb .extra{font-size:.98rem}
.fb .info{font-size:.98rem;border-left:4px solid var(--gold);padding-left:10px}
.fb .btn{align-self:flex-start;margin-top:4px}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .25s}

/* omgrepskort */
.flip{perspective:1200px;cursor:pointer;user-select:none}
.flip .inner{position:relative;height:260px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.face.b{transform:rotateY(180deg);background:var(--pri-soft)}
.face .w{font-family:var(--fd);font-weight:700;font-size:2.2rem;line-height:1.15}
.face .d{font-size:1.2rem;font-weight:700}
.face .hint{font-size:.85rem;color:var(--muted)}
.face .ex{font-size:.95rem;color:var(--muted)}
.fnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fnav .btn{min-width:70px}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.arktag{font-size:.75rem;font-weight:700;background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:1px 8px}

/* koble */
.kgrid{display:grid;grid-template-columns:2fr 3fr;gap:10px}
.kcol{display:flex;flex-direction:column;gap:8px}
.kb{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 10px;font-weight:700;font-size:.98rem;min-height:56px;line-height:1.3;transition:border-color .1s,background .15s,opacity .3s}
.kcol:first-child .kb{font-family:var(--fd);font-size:1.08rem}
.kb.sel{border-color:var(--pri);background:var(--pri-soft)}
.kb.bad{border-color:var(--coral);background:var(--coral-soft)}
.kb.done{border-color:var(--ok);background:var(--ok-soft);opacity:.45;cursor:default}

/* rekkefølge */
.ord{display:flex;flex-direction:column;gap:8px}
.ob{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-weight:700;min-height:56px}
.ob .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-size:1.2rem}
.ob.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.ob.done .n{background:var(--ok);color:#fff;font-size:1rem}
.ob.bad{border-color:var(--coral);background:var(--coral-soft)}
.ob .yr{margin-left:auto;font-family:var(--fd);color:var(--ok);white-space:nowrap}

/* pyramide */
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0}
.tier{border:2px solid transparent;border-radius:14px;padding:10px 12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;transition:transform .1s,border-color .1s}
.tier:hover{transform:scale(1.02)}
.tier[aria-pressed="true"]{border-color:var(--pri)}
.tier .pct{font-family:var(--fd);font-weight:700;color:var(--muted)}
.tier.konge{width:34%;background:var(--t-konge)} .tier.forste{width:54%;background:var(--t-forste)}
.tier.andre{width:74%;background:var(--t-andre)} .tier.tredje{width:100%;background:var(--t-tredje);min-height:80px}
.godlig{font-size:1.6rem;line-height:1}
.skatt{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.skatt .sb{height:22px;border-radius:6px;background:var(--gold)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips span{background:var(--card2);border-radius:10px;padding:3px 10px;font-size:.95rem}

/* filosofkort */
.fcard{display:flex;flex-direction:column;gap:14px}
.fhead{display:flex;gap:14px;align-items:center}
.port{flex:none;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;border:4px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.fsec{display:flex;flex-direction:column;gap:6px;background:var(--card2);border-radius:14px;padding:12px 14px}
.fsec h3{display:flex;gap:8px;align-items:center}
.fsec h3 .num{width:26px;height:26px;font-size:.9rem;font-family:var(--fb)}
.fsec ul{margin:0;padding-left:20px}
.quote{font-family:var(--fd);font-style:italic;font-size:1.1rem}

/* tidslinje */
.tl{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:22px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--line)}
.tlh{font-family:var(--fd);font-weight:700;font-size:1.2rem;margin-top:8px}
.ti{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:baseline}
.ti::before{content:"";position:absolute;left:-19px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--pri);border:2px solid var(--bg)}
.ti .y{font-family:var(--fd);font-weight:700;color:var(--pri);white-space:nowrap}
.ti .y small{font-family:var(--fb);font-weight:400;color:var(--muted);font-size:.85rem;display:block}

/* årsaker */
.ars{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.ar .ic{font-size:1.8rem}

/* resultat */
.res{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.res .big{font-size:3.6rem;line-height:1}
.res .score{font-family:var(--fd);font-weight:700;font-size:2.4rem;color:var(--pri)}
.misslist{text-align:left;width:100%;display:flex;flex-direction:column;gap:6px}
.misslist div{background:var(--card2);border-radius:12px;padding:8px 12px}

@media (max-width:520px){
  h1{font-size:1.65rem}
  .qbig{font-size:1.65rem} .qbig.sent{font-size:1.2rem}
  .opts,.opts.three{grid-template-columns:1fr}
  .opts.two{grid-template-columns:1fr 1fr}
  .kgrid{grid-template-columns:1fr 1.4fr}
  .kb{font-size:.9rem;padding:8px 6px}
  .face .w{font-size:1.8rem}
  .tier{font-size:.92rem;padding:8px}
  .tier.konge{width:46%} .tier.forste{width:64%} .tier.andre{width:82%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="topin">

  <div class="stats">
    <span class="pill" id="pillKan" title="Omgrep du kan">⭐ 0/0</span>
    <button class="iconbtn" data-act="theme" id="themeBtn" aria-label="Bytt lys/mørk">☾</button>
  </div>
</div></header>

<main class="wrap" id="app"></main>

<script>
/* ---------- hjelpere ---------- */
const R = window.REV;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const norm = s => String(s).toLowerCase().normalize("NFC").replace(/[.,;:!?«»"()\-–]/g, " ").replace(/\s+/g, " ").trim();
function lev(a, b) {
  const m = a.length, n = b.length;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}

/* ---------- lagring ---------- */
const KEY = "revolusjon-v1";
const fresh = () => ({ v: 1, theme: "auto", del: "opplysning", lv: {}, best: {}, fil: "newton", stand: "tredje" });
function load() { try { const x = JSON.parse(localStorage.getItem(KEY)); if (x && x.v === 1) return Object.assign(fresh(), x); } catch (e) {} return fresh(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load();
if (S.del !== "alle" && !R.DELER.some(d => d.id === S.del)) S.del = "alle";

/* Nivå per omgrep: 0 ny, 1 kjenner igjen, 2 på vei, 3 sitter (skrevet riktig) */
const lv = g => S.lv[g.o] || 0;
function step(v, kind, ok) { return ok ? (kind === "write" ? Math.min(3, v + 1) : Math.max(v, 1)): Math.max(0, v - 1); }
function updLv(g, kind, ok) { S.lv[g.o] = step(lv(g), kind, ok); save(); updTop(); }

/* Utvalg etter valgt del */
const iDel = x => S.del === "alle" || x.del === S.del;

/* ---------- sjekk av skrevne svar ---------- */
function checkOmg(v, g) {
  const a = norm(v), hoved = norm(g.o), alle = [g.o, ...(g.alt || [])].map(norm);
  if (a === hoved) return { st: "ok" };
  if (alle.includes(a)) return { st: "ok", note: `Godtatt! I spillet skriver vi det <b>${esc(g.o)}</b>.` };
  const best = Math.min(...alle.map(x => lev(a, x)));
  const tol = hoved.length >= 10 ? 2 : hoved.length >= 5 ? 1 : 0;
  if (best <= tol) return { st: "typo" };
  if (best <= tol + 2) return { st: "almost" };
  return { st: "wrong" };
}

/* ---------- oppgavetyper ---------- */
function andre(g, n, felt) {
  const same = shuffle(omgrep().filter(x => x !== g && x[felt] !== g[felt]));
  const rest = shuffle(R.OMGREP.filter(x => x !== g && !same.includes(x)));
  return [...same, ...rest].slice(0, n);
}
const lang = opts => opts.some(o => o.length > 30);
function itDef(g) { const options = [g.d, ...andre(g, 3, "d").map(x => x.d)]; return { kind: "choice", g, label: "Hva betyr omgrepet?", big: g.o, options, wide: true, answer: g.d, line: `${g.o}: ${g.d}`, info: g.ex }; }
function itOmg(g) { const options = [g.o, ...andre(g, 3, "o").map(x => x.o)]; return { kind: "choice", g, label: "Hvilket omgrep passer?", big: g.d, sent: true, options, answer: g.o, line: `${g.o}: ${g.d}`, info: g.ex }; }
function itSkriv(g) {

}
function itFakta(f) { const options = [f.a, ...f.feil]; return { kind: "choice", label: "Faktaspørsmål", big: f.q, sent: true, options, wide: lang(options), answer: f.a, line: `${f.q} → ${f.a}`, info: f.f }; }

function itMakt(t, m) {

    info: "Montesquieu: Makten må deles, så ingen kan bestemme alt." };

function itAar(e) {
  const yrs = [...new Set(R.TIDSLINJE.map(x => x.aar))].filter(y => y !== e.aar).sort((a, b) => Math.abs(a - e.aar) - Math.abs(b - e.aar));
  const options = [e.aar, ...shuffle(yrs.slice(0, 6)).slice(0, 3)].map(String);
  return { kind: "choice", label: "Når skjedde dette?", big: `${e.ikon || ""} ${e.t}`, sent: true, options, answer: String(e.aar), line: `${tidTxt(e)}: ${e.t}` };
}
const allStand = () => R.STENDER.flatMap(st => st.ting.map(t => [t, st]));
const allMente = () => R.FILOSOFER.flatMap(f => f.mente.map(t => [t, f]));
const allMakt = () => R.MAKT.flatMap(m => m.ting.map(t => [t, m]));
function spre(par, n) {   // jevnt fordelt på gruppene
  const grupper = new Map(); shuffle(par.slice()).forEach(p => { const k = p[1]; if (!grupper.has(k)) grupper.set(k, []); grupper.get(k).push(p); });
  const ut = [], g = [...grupper.values()];
  for (let i = 0; ut.length < n && g.some(x => x.length); i++) { const x = g[i % g.length]; if (x.length) ut.push(x.shift()); }
  return shuffle(ut);
}

/* ---------- quiz-motor ---------- */
let Q = null;
function startQuiz(o) {
  if (!o.items.length) { alert("Det er ingen oppgaver i denne delen ennå."); return; }

}
function qRender() {

  } else {

    ${body}
    <div class="fb" id="fb" aria-live="polite"></div>
  </div>`);
  if (it.kind === "write") setTimeout(() => $("#win") && $("#win").focus(), 60);
}
function qAnswer(r, given) {
  const it = Q.queue[0]; Q.answered = true;
  const ok = ["ok", "typo"].includes(r.st);
  if (!(it.id in Q.first)) {
    Q.first[it.id] = ok;
    if (it.g) updLv(it.g, it.kind, ok);
    if (ok) window.Gull && Gull.tjen(it.kind === "write" ? 2 : 1);
  }
  if (ok || !Q.requeue) Q.done++;
  else Q.queue.splice(Math.min(Q.queue.length, 4), 0, it);
  $("#qbar").style.width = (Q.done / Q.total * 100) + "%";
  $("#qcount").textContent = `${Q.done}/${Q.total}`;
  const fas = `<b>${esc(it.fasit || it.answer)}</b>`;
  let head, extra = "";
  if (r.st === "ok") head = pick(["Riktig!", "Bravo!", "Très bien!", "Helt riktig!", "Magnifique!"]);
  else if (r.st === "typo") { head = "Riktig!"; extra = `Det skrives ${fas}.`; }
  else if (r.st === "almost") { head = "Nesten!"; extra = `Riktig er ${fas}.`; }
  else { head = given ? "Ikke helt" : "Svaret er"; extra = given ? `Riktig svar: ${fas}` : fas; }
  if (r.note) extra = r.note;
  if (!ok && Q.requeue) extra += `<br><span class="muted">Du får den igjen om litt.</span>`;
  const fb = $("#fb");
  fb.className = "fb pop " + (ok ? "ok" : r.st === "almost" ? "almost" : "wrong");
  fb.innerHTML = `<div class="head">${ok ? "✓ " : ""}${head}</div>${extra ? `<div class="extra">${extra}</div>` : ""}${it.info ? `<div class="info">${esc(it.info)}</div>` : ""}
    <button class="btn pri" data-act="next" id="nextBtn">Neste →</button>`;
  if (!ok) $("#qcard").classList.add("shake");
  if (it.kind === "write") {
    const inp = $("#win"); inp.readOnly = true; inp.classList.add(ok ? "good" : "bad");
    $("#wsub").hidden = true; $("#idk").hidden = true;
    setTimeout(() => $("#nextBtn") && $("#nextBtn").focus({ preventScroll: true }), 0);
  } else $("#nextBtn").focus({ preventScroll: true });
}
function qNext() { clearTimeout(autoTimer); if (!Q) return; Q.queue.shift(); if (!Q.queue.length) qEnd(); else qRender(); }
function resultat({ right, total, bestKey, missHtml, missTitle, again }) {
  const pct = Math.round(right / total * 100);
  if (total >= 5) window.Gull && Gull.bonus(pct >= 90 ? 5 : pct >= 75 ? 3 : pct >= 50 ? 1 : 0, "Runde ferdig!");
  let rekord = false;
  if (bestKey) { const b = S.best; if (b[bestKey] == null || pct > b[bestKey]) { b[bestKey] = pct; rekord = true; } save(); }
  const [ico, msg] = pct >= 90 ? ["🌟", "Magnifique!"] : pct >= 75 ? ["👏", "Très bien!"] : pct >= 50 ? ["💪", "Bra! Litt til, så sitter det."] : ["🌱", "Godt jobba – ta en runde til!"];
  show(`
  <div class="card res pop">
    <div class="big">${ico}</div>
    <h2>${msg}</h2>
    <div class="score">${right} av ${total}</div>
    <p class="muted">riktig på første forsøk${rekord && bestKey ? " – ny rekord! 🏆" : ""}</p>
    ${missHtml ? `<div class="misslist"><h3>${missTitle}</h3>${missHtml}</div>` : ""}
    <div class="row" style="width:100%">
      <button class="btn pri big" data-act="${again}">Én gang til</button>
      <button class="btn big" data-act="home">Til menyen</button>
    </div>
  </div>`);
}
function qEnd() {
  const right = Object.values(Q.first).filter(Boolean).length;
  const items = Q.items.filter(it => Q.first[it.id] === false);
  resultat({ right, total: Q.total, bestKey: Q.bestKey, again: Q.again,
    missTitle: Q.requeue ? "Disse måtte du ta flere ganger" : "Disse bør du øve mer på",
    missHtml: items.map(it => `<div>${esc(it.line)}</div>`).join("") });
}

/* ---------- moduser ---------- */
const MODES = {
  velgOmg() { startQuiz({ title: `Hva betyr det? · ${delNavn()}`, again: "velgOmg", bestKey: "velg-" + S.del, items: shuffle(omgrep().map(g => Math.random() < .5 ? itDef(g) : itOmg(g))) }); },
  skrivOmg() { startQuiz({ title: `Skriv omgrepet · ${delNavn()}`, again: "skrivOmg", bestKey: "skriv-" + S.del, items: shuffle(omgrep().map(itSkriv)) }); },
  faktaQ() { startQuiz({ title: `Faktaquiz · ${delNavn()}`, again: "faktaQ", bestKey: "fakta-" + S.del, items: shuffle(fakta().map(itFakta)).slice(0, 15) }); },
  sortStand() { startQuiz({ title: "Sorter i stendene", again: "sortStand", bestKey: "stand", items: spre(allStand(), 12).map(([t, st]) => itStand(t, st)) }); },
  hvemMente() { startQuiz({ title: "Hvem mente hva?", again: "hvemMente", bestKey: "mente", items: spre(allMente(), 12).map(([t, f]) => itMente(t, f)) }); },
  makt() { startQuiz({ title: "Maktfordeling", again: "makt", bestKey: "makt", items: spre(allMakt(), 10).map(([t, m]) => itMakt(t, m)) }); },
  prove() {
    const og = shuffle(omgrep()), fk = shuffle(fakta()), hd = shuffle(hendelser());
    const opp = S.del === "alle" || S.del === "opplysning";
    const items = [
      ...og.slice(0, 5).map(g => Math.random() < .5 ? itDef(g) : itOmg(g)),
      ...og.slice(5, 8).map(itSkriv),
      ...fk.slice(0, opp ? 6 : 9).map(itFakta),
      ...hd.slice(0, 3).map(itAar),
      ...(opp ? [...spre(allMente(), 2).map(([t, f]) => itMente(t, f)), ...spre(allStand(), 1).map(([t, s]) => itStand(t, s))] : []),
    ];
    startQuiz({ title: `Prøveprøve · ${delNavn()}`, again: "prove", requeue: false, bestKey: "prove-" + S.del, items: shuffle(items).slice(0, 20) });
  },
};

/* ---------- koble sammen (omgrep og «da og nå») ---------- */
let K = null;
function koble(par, tittel, again, rekordKey, hjelp) {
  const gl = shuffle(par.slice()), nR = Math.ceil(gl.length / 4), size = Math.ceil(gl.length / nR), rounds = [];
  for (let i = 0; i < gl.length; i += size) rounds.push(gl.slice(i, i + size));
  K = { rounds, r: 0, sel: null, err: 0, t0: Date.now(), feil: new Set(), tittel, again, rekordKey, hjelp };
  kRender();
}
function kRender() {
  const rd = K.rounds[K.r]; K.left = rd.length; K.sel = null;
  const L = shuffle(rd.slice()), Rr = shuffle(rd.slice());
  show(`
  <div class="qhead"><button class="iconbtn x" data-act="home" aria-label="Avslutt">✕</button>
    <div class="bar"><i style="width:${K.r / K.rounds.length * 100}%"></i></div>
    <span class="pill" id="ktid">⏱ 0</span></div>
  <div class="qtitle">${esc(K.tittel)} – runde ${K.r + 1} av ${K.rounds.length}</div>
  <p class="muted small">${esc(K.hjelp)}</p>
  <div class="kgrid">
    <div class="kcol">${L.map(p => `<button class="kb" data-act="kpick" data-side="l" data-k="${esc(p.k)}">${esc(p.l)}</button>`).join("")}</div>
    <div class="kcol">${Rr.map(p => `<button class="kb" data-act="kpick" data-side="r" data-k="${esc(p.k)}">${esc(p.r)}</button>`).join("")}</div>
  </div>
  <p class="small muted" id="kerr">Feil: ${K.err}</p>`);
  const tick = () => { const e = $("#ktid"); if (e) e.textContent = `⏱ ${Math.floor((Date.now() - K.t0) / 1000)}`; };
  tick(); kTimer = setInterval(tick, 1000);
}
function kPick(b) {
  if (b.classList.contains("done")) return;
  if (K.sel === b) { b.classList.remove("sel"); K.sel = null; return; }
  if (!K.sel || K.sel.dataset.side === b.dataset.side) { if (K.sel) K.sel.classList.remove("sel"); K.sel = b; b.classList.add("sel"); return; }
  const a = K.sel; K.sel = null; a.classList.remove("sel");
  if (a.dataset.k === b.dataset.k) {
    [a, b].forEach(x => { x.classList.add("done"); x.disabled = true; });
    const g = R.OMGREP.find(x => x.o === a.dataset.k); if (g && !K.feil.has(g.o)) updLv(g, "choice", true);
    if (--K.left === 0) setTimeout(kNeste, 450);
  } else {
    K.err++; K.feil.add(a.dataset.k); K.feil.add(b.dataset.k);
    [a, b].forEach(x => { x.classList.add("bad", "shake"); setTimeout(() => x.classList.remove("bad", "shake"), 550); });
    $("#kerr").textContent = `Feil: ${K.err}`;
  }
}
function kNeste() {
  if (!K) return;
  if (++K.r < K.rounds.length) return kRender();
  const sek = Math.round((Date.now() - K.t0) / 1000), b = S.best, rk = K.rekordKey, rek = rk && (b[rk] == null || sek < b[rk]);
  if (rek) { b[rk] = sek; save(); }
  const n = K.rounds.flat().length;
  window.Gull && Gull.bonus(Math.max(2, Math.round(n / 2) - K.err), K.err === 0 ? "Ingen feil!" : "Alle parene funnet!");
  show(`
  <div class="card res pop">
    <div class="big">${K.err === 0 ? "🌟" : "🧩"}</div>
    <h2>${K.err === 0 ? "Magnifique! Ingen feil!" : "Alle parene funnet!"}</h2>
    <div class="score">${sek} sek</div>
    <p class="muted">${n} par · ${K.err} feil${rek ? " · ny rekord! 🏆" : rk && b[rk] != null ? ` · rekorden er ${b[rk]} sek` : ""}</p>
    <div class="row" style="width:100%">
      <button class="btn pri big" data-act="${K.again}">Én gang til</button>
      <button class="btn big" data-act="home">Til menyen</button>
    </div>
  </div>`);
  K = null;
}

/* ---------- sett i rekkefølge ---------- */
let O = null;
function rekke() {
  const pool = shuffle(hendelser().slice()), brukt = new Set(), rounds = [];
  let cur = [];
  for (const e of pool) {
    if (cur.some(x => tidKey(x) === tidKey(e))) continue;
    cur.push(e);
    if (cur.length === 5) { rounds.push(cur); cur = []; if (rounds.length === 3) break; }
  }
  if (!rounds.length && cur.length >= 3) rounds.push(cur);
  if (!rounds.length) { alert("For få hendelser i denne delen."); return; }
  O = { rounds, r: 0, err: 0 };
  oRender();
}
function oRender() {
  const rd = O.rounds[O.r]; O.sorted = rd.slice().sort((a, b) => tidKey(a) - tidKey(b)); O.next = 0; O.rErr = 0;
  O.vis = shuffle(rd.slice());
  show(`
  <div class="qhead"><button class="iconbtn x" data-act="home" aria-label="Avslutt">✕</button>
    <div class="bar"><i style="width:${O.r / O.rounds.length * 100}%"></i></div>
    <span class="qcount">Runde ${O.r + 1}/${O.rounds.length}</span></div>
  <div class="qtitle">Sett i rekkefølge · ${esc(delNavn())}</div>
  <div class="card qcard">
    <div class="qlabel">Trykk på det som skjedde <b>først</b>, så det neste …</div>
    <div class="ord">${O.vis.map((e, i) => `<button class="ob" data-act="opick:${i}"><span class="n">${e.ikon || "•"}</span><span>${esc(e.t)}</span></button>`).join("")}</div>
    <div class="fb" id="fb"></div>
  </div>`);
}
function oPick(i, b) {
  if (!O || b.classList.contains("done")) return;
  const e = O.vis[i];
  if (tidKey(e) === tidKey(O.sorted[O.next])) {
    O.next++; b.classList.add("done"); b.disabled = true;
    b.querySelector(".n").textContent = O.next;
    b.insertAdjacentHTML("beforeend", `<span class="yr">${esc(tidTxt(e))}</span>`);
    if (O.next === O.sorted.length) {
      if (O.rErr === 0) window.Gull && Gull.tjen(2);
      const fb = $("#fb"); fb.className = "fb pop ok";
      fb.innerHTML = `<div class="head">✓ ${O.rErr === 0 ? "Perfekt rekkefølge!" : "Riktig rekkefølge!"}</div>
        <button class="btn pri" data-act="onext" id="nextBtn">${O.r + 1 < O.rounds.length ? "Neste runde →" : "Ferdig →"}</button>`;
      $("#nextBtn").focus({ preventScroll: true });
    }
  } else {
    O.err++; O.rErr++;
    b.classList.add("bad", "shake"); setTimeout(() => b.classList.remove("bad", "shake"), 550);
  }
}
function oNext() {
  if (++O.r < O.rounds.length) return oRender();
  const b = S.best, k = "rekke-" + S.del, rek = b[k] == null || O.err < b[k];
  if (rek) { b[k] = O.err; save(); }
  window.Gull && Gull.bonus(O.err === 0 ? 5 : O.err <= 3 ? 3 : 1, "Runde ferdig!");
  show(`
  <div class="card res pop">
    <div class="big">${O.err === 0 ? "🌟" : "📅"}</div>
    <h2>${O.err === 0 ? "Ingen feil – du kan tidslinja!" : "Alle rundene ferdige!"}</h2>
    <div class="score">${O.err} feil</div>
    <p class="muted">${rek ? "Ny rekord! 🏆" : `Rekorden er ${b[k]} feil`}</p>
    <div class="row" style="width:100%">
      <button class="btn pri big" data-act="rekke">Én gang til</button>
      <button class="btn big" data-act="tidslinje">Se tidslinja</button>
    </div>
  </div>`);
  O = null;
}

/* ---------- handlinger ---------- */
const ACT = {
  home, kort, pyramide, filosofer, tidslinje, aarsaker, rekke,
  koble: () => koble(omgrep().map(g => ({ k: g.o, l: g.o, r: g.d })), `Koble sammen · ${delNavn()}`, "koble", "koble-" + S.del, "Trykk på et omgrep og så på forklaringen som hører til."),
  daNaa: () => koble(R.DAOGNAA.map(x => ({ k: x.ide, l: x.ide, r: x.naa })), "Da og nå", "daNaa", null, "Koble ideen fra 1700-tallet til det vi har i Norge i dag."),
  velgOmg: () => MODES.velgOmg(), skrivOmg: () => MODES.skrivOmg(), faktaQ: () => MODES.faktaQ(),
  sortStand: () => MODES.sortStand(), hvemMente: () => MODES.hvemMente(), makt: () => MODES.makt(), prove: () => MODES.prove(),
  del(id) { S.del = id; save(); const y = window.scrollY; home(); window.scrollTo(0, y); },
  stand(id) { S.stand = id; save(); const y = window.scrollY; pyramide(); window.scrollTo(0, y); },
  fil(id) { S.fil = id; save(); const y = window.scrollY; filosofer(); window.scrollTo(0, y); },
  theme() { S.theme = erMork() ? "light" : "dark"; save(); applyTheme(); },
  reset() { if (confirm("Nullstille fremgangen i Kampen for rettigheter?")) { S = Object.assign(fresh(), { theme: S.theme }); save(); home(); } },
  flip() { F.on = !F.on; $("#flip").classList.toggle("on", F.on); },
  fnext() { F.i = (F.i + 1) % F.list.length; F.on = false; fRender(); },
  fprev() { F.i = (F.i - 1 + F.list.length) % F.list.length; F.on = false; fRender(); },
  fmix() { F.mix = !F.mix; F.list = F.mix ? shuffle(omgrep()) : omgrep(); F.i = 0; F.on = false; fRender(); },
  frev() { F.rev = !F.rev; F.on = false; fRender(); },
  opt(_, b) {
    if (!Q || Q.answered) return;
    const it = Q.queue[0], v = b.dataset.v, ok = v === it.answer;
    document.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.dataset.v === it.answer) x.classList.add("good"); });
    if (!ok) b.classList.add("bad");
    qAnswer({ st: ok ? "ok" : "wrong" }, true);
  },
  idk() { if (Q && !Q.answered) qAnswer({ st: "wrong" }, false); },
  next() { qNext(); },
  kpick(_, b) { kPick(b); },
  opick(i, b) { oPick(+i, b); },
  onext() { oNext(); },
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const [act, arg] = b.dataset.act.split(/:(.*)/s);
  if (ACT[act]) ACT[act](arg, b, e);
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id !== "wform" || !Q) return;
  if (Q.answered) return qNext();
  const v = $("#win").value; if (!v.trim()) return;
  qAnswer(Q.queue[0].check(v), true);
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if ($("#flip")) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); ACT.flip(); }
    else if (e.key === "ArrowRight") ACT.fnext();
    else if (e.key === "ArrowLeft") ACT.fprev();
    return;
  }
  if (Q && $("#qcard")) {
    if (!Q.answered && Q.queue[0].kind === "choice" && /^[1-9]$/.test(e.key)) {
      const b = document.querySelectorAll(".opt")[+e.key - 1]; if (b) b.click();
    } else if (Q.answered && e.key === "Enter" && e.target.id !== "nextBtn") { e.preventDefault(); qNext(); }
  }
});

applyTheme();
home();
</script>
</body>
</html>
