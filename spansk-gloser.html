<script>
/* ======================================================================
   GLOSER – NY PRØVE? Legg en ny blokk ØVERST i PROVER-lista under.
   Spillet velger automatisk den neste prøven som ikke har vært ennå.

   id         kort navn uten æøå/mellomrom (fremgangen lagres per id)
   tittel     tema, f.eks. "Familien"
   dato       prøvedato, ÅÅÅÅ-MM-DD
   gloser     es  = spansk (uten el/la)
              no  = norsk, slik det står på glosearket
              alt = andre norske svar som også godtas (valgfritt)
              kj  = "m" (hankjønn, el) eller "f" (hunkjønn, la) – trengs for bøying
              par = ordet for motsatt kjønn, f.eks. tío ↔ tía (valgfritt)
              fl  = flertall hvis det ikke bare er +s (valgfritt)
   setninger  enkle setninger; ord = glosen slik den står i setningen
   boying     hvilke bøyingsøvelser som passer:
              "artikkel" (el/la), "flertall", "kjonn" (tío→tía), "mi" (mi/mis), "tener"
   ====================================================================== */
const PROVER = [
  {
    id: "familien", tittel: "Familien", dato: "2026-11-11",
    gloser: [
      { es: "madre",     no: "mor",               alt: ["mamma"],                          kj: "f", par: "padre" },
      { es: "padre",     no: "far",               alt: ["pappa"],                          kj: "m", par: "madre" },
      { es: "madrastra", no: "stemor",            alt: [],                                 kj: "f", par: "padrastro" },
      { es: "padrastro", no: "stefar",            alt: [],                                 kj: "m", par: "madrastra" },
      { es: "hija",      no: "dotter",            alt: ["datter"],                         kj: "f", par: "hijo" },
      { es: "hijo",      no: "son",               alt: ["sønn"],                           kj: "m", par: "hija" },
      { es: "hermana",   no: "søster",            alt: ["syster"],                         kj: "f", par: "hermano" },
      { es: "hermano",   no: "bror",              alt: [],                                 kj: "m", par: "hermana" },
      { es: "abuela",    no: "bestemor",          alt: ["farmor", "mormor"],               kj: "f", par: "abuelo" },
      { es: "abuelo",    no: "bestefar",          alt: ["farfar", "morfar"],               kj: "m", par: "abuela" },
      { es: "nieta",     no: "barnebarn (jente)", alt: [],                                 kj: "f", par: "nieto" },
      { es: "nieto",     no: "barnebarn (gut)",   alt: ["barnebarn gutt"],                 kj: "m", par: "nieta" },
      { es: "primo",     no: "søskenbarn (gut)",  alt: ["fetter", "søskenbarn gutt"],      kj: "m", par: "prima" },
      { es: "prima",     no: "søskenbarn (jente)",alt: ["kusine"],                         kj: "f", par: "primo" },
      { es: "tía",       no: "tante",             alt: [],                                 kj: "f", par: "tío" },
      { es: "tío",       no: "onkel",             alt: [],                                 kj: "m", par: "tía" },
    ],
    setninger: [
      { es: "Mi madre se llama Ana.",        no: "Moren min heter Ana.",              ord: "madre" },
      { es: "Mi padre se llama Juan.",       no: "Faren min heter Juan.",             ord: "padre" },
      { es: "Tengo un hermano.",             no: "Jeg har en bror.",                  ord: "hermano" },
      { es: "Tengo dos hermanas.",           no: "Jeg har to søstre.",                ord: "hermanas" },
      { es: "¿Tienes hermanos?",             no: "Har du søsken?",                    ord: "hermanos" },
      { es: "Mi abuela tiene ochenta años.", no: "Bestemoren min er åtti år.",        ord: "abuela" },
      { es: "Mi abuelo vive en Madrid.",     no: "Bestefaren min bor i Madrid.",      ord: "abuelo" },
      { es: "Mi tía es muy simpática.",      no: "Tanten min er veldig hyggelig.",    ord: "tía" },
      { es: "Mi tío es alto.",               no: "Onkelen min er høy.",               ord: "tío" },
      { es: "Mi prima tiene diez años.",     no: "Kusinen min er ti år.",             ord: "prima" },
      { es: "Mi primo se llama Pablo.",      no: "Fetteren min heter Pablo.",         ord: "primo" },
      { es: "Lucía es mi hija.",             no: "Lucía er datteren min.",            ord: "hija" },
      { es: "Carlos es mi hijo.",            no: "Carlos er sønnen min.",             ord: "hijo" },
      { es: "Mi madrastra es de Noruega.",   no: "Stemoren min er fra Norge.",        ord: "madrastra" },
      { es: "Mi padrastro trabaja mucho.",   no: "Stefaren min jobber mye.",          ord: "padrastro" },
      { es: "Marta es la nieta de Rosa.",    no: "Marta er barnebarnet til Rosa.",    ord: "nieta" },
      { es: "Pablo es el nieto de Rosa.",    no: "Pablo er barnebarnet til Rosa.",    ord: "nieto" },
    ],
    boying: ["artikkel", "flertall", "kjonn", "mi", "tener"],
  },
];
</script>
<style>

<script>
/* ---------- hjelpere ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
const clean = s => String(s).toLowerCase().replace(/[¿?¡!.,;:()«»"]/g, " ").replace(/\s+/g, " ").trim();
function lev(a, b) {
  const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 9;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}

/* ---------- lagring ---------- */
const KEY = "spansk-gloser-v1";
const fresh = () => ({ v: 1, theme: "auto", valgt: null, prover: {} });
function load() { try { const x = JSON.parse(localStorage.getItem(KEY)); if (x && x.v === 1) return Object.assign(fresh(), x); } catch (e) {} return fresh(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load();

/* ---------- prøve ---------- */
const iso = d => d.toISOString().slice(0, 10);
const idag = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const sortert = () => PROVER.slice().sort((a, b) => a.dato.localeCompare(b.dato));
function standardProve() { const s = sortert(); return (s.find(p => p.dato >= idag()) || s[s.length - 1]).id; }
function P() { return PROVER.find(p => p.id === S.valgt) || PROVER.find(p => p.id === standardProve()); }
function PS() { const id = P().id; if (!S.prover[id]) S.prover[id] = { lv: {}, best: {} }; return S.prover[id]; }
const lv = g => PS().lv[g.es] || 0;
function updLv(g, kind, ok) {
  const st = PS(); let v = st.lv[g.es] || 0;
  if (ok) v = kind === "write" ? Math.min(3, v + 1) : Math.max(v, 1);
  else v = Math.max(0, v - 1);
  st.lv[g.es] = v; save(); updTop();
}
const byEs = es => P().gloser.find(g => g.es === es);
const artOf = g => g.kj === "m" ? "el" : "la";
const plArt = g => g.kj === "m" ? "los" : "las";
const plOf = g => g.fl || g.es + "s";
const unUna = g => g.kj === "m" ? "un" : "una";
function dagerTil(d) { const a = new Date(idag() + "T00:00:00"), b = new Date(d + "T00:00:00"); return Math.round((b - a) / 864e5); }
const fmtDato = d => new Date(d + "T00:00:00").toLocaleDateString("nb-NO", { weekday: "long", day: "numeric", month: "long" });
function naarTekst(d) { const n = dagerTil(d); return n > 1 ? `om ${n} dager` : n === 1 ? "i morgen!" : n === 0 ? "i dag!" : "er ferdig"; }

/* ---------- tale ---------- */
const TTS = "speechSynthesis" in window;
let esVoice = null;
function pickVoice() { const v = speechSynthesis.getVoices(); esVoice = v.find(x => /^es[-_]ES/i.test(x.lang)) || v.find(x => /^es/i.test(x.lang)) || null; }
if (TTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t) {
  if (!TTS) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = "es-ES"; if (esVoice) u.voice = esVoice; u.rate = .85;
  speechSynthesis.speak(u);
}
const sayBtn = (t, sm) => TTS ? `<button class="say${sm ? " sm" : ""}" data-say="${esc(t)}" aria-label="Lytt: ${esc(t)}" title="Lytt">🔊</button>` : "";

/* ---------- tema og topp ---------- */
function applyTheme() { const r = document.documentElement; if (S.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme); updTop(); }

  $("#themeBtn").textContent = erMork() ? "☀" : "☾";
}

/* ---------- visning ---------- */
const app = $("#app");
let kTimer = null, autoTimer = null;
function show(html) {

/* ---------- glosekort ---------- */

function kort() { F = { list: P().gloser.slice(), i: 0, on: false, noFirst: false, mix: false }; fRender(); }

/* ---------- oppgaver ---------- */
function distract(g, n = 3) {
  const others = shuffle(P().gloser.filter(x => x !== g));
  const par = g.par && byEs(g.par);
  if (par && Math.random() < .6) { others.splice(others.indexOf(par), 1); others.unshift(par); }
  return others.slice(0, n);
}
function itVelgEsNo(g) {
  return { kind: "choice", g, label: "Hva betyr ordet?", big: g.es, say: g.es, options: [g.no, ...distract(g).map(x => x.no)], answer: g.no, line: `${g.es} = ${g.no}`, sayF: g.es,
    fe: { k: `${g.es}:es-no`, q: `Hva betyr det spanske ordet «${g.es}»?` } };
}
function itVelgNoEs(g) {
  return { kind: "choice", g, label: "Hva heter det på spansk?", big: g.no, options: [g.es, ...distract(g).map(x => x.es)], answer: g.es, line: `${g.no} = ${g.es}`, sayF: g.es,
    fe: { k: `${g.es}:no-es`, q: `Hva heter «${g.no}» på spansk?` } };
}
function itSkrivEs(g) {
  return {
    kind: "write", lang: "es", g, label: "Skriv på spansk", big: g.no, fasit: g.es, line: `${g.no} = ${g.es}`, sayF: `${artOf(g)} ${g.es}`,
    fe: { k: `${g.es}:skriv-es`, q: `Skriv på spansk: «${g.no}»`, godta: [`${artOf(g)} ${g.es}`], forkl: `Det heter ${artOf(g)} ${g.es}.` },
    check: v => {
      const r = checkEs(v, g.es);
      if ((r.st === "ok" || r.st === "accent") && (r.art === "el" || r.art === "la") && r.art !== artOf(g)) r.note = `Obs: det heter <b>${artOf(g)} ${esc(g.es)}</b>.`;
      return r;
    }
  };
}
function itSkrivNo(g) {
  return { kind: "write", lang: "no", g, label: "Skriv på norsk", big: g.es, say: g.es, fasit: g.no, line: `${g.es} = ${g.no}`, check: v => checkNo(v, g),
    fe: { k: `${g.es}:skriv-no`, q: `Skriv på norsk: «${g.es}»`, godta: [g.no.replace(/\(.*?\)/g, "").trim(), ...(g.alt || [])].filter(x => x && x !== g.no) } };
}
const ART_RE = /^(el|la|los|las|un|una|mi|mis) /;
function checkEs(input, fasit) {
  let a = clean(input), art = null; const f = clean(fasit);
  const m = a.match(ART_RE); if (m && !ART_RE.test(f + " ")) { art = m[1]; a = a.slice(m[0].length); }
  if (!a) return { st: "wrong" };
  if (a === f) return { st: "ok", art };
  if (fold(a) === fold(f)) return { st: "accent", art };
  if (f.length >= 4 && lev(fold(a), fold(f)) <= 1) return { st: "almost" };
  return { st: "wrong" };
}
const NO_ART = /^(en|ei|et|min|mi|mitt|mine) /;
function noForms(g) {
  const set = new Set(), add = s => { const c = clean(s); set.add(c); set.add(c.replace(NO_ART, "")); };
  add(g.no); add(g.no.replace(/\(.*?\)/g, "")); (g.alt || []).forEach(add);
  return [...set].filter(Boolean);
}
function checkNo(input, g) {
  const a = clean(input).replace(NO_ART, ""); if (!a) return { st: "wrong" };
  const forms = noForms(g);
  if (forms.includes(a)) return { st: "ok" };
  if (forms.some(f => f.length >= 4 && lev(a, f) <= 1)) return { st: "typo" };
  return { st: "wrong" };
}

/* ---------- quiz-motor ---------- */
let Q = null;
function startQuiz(o) {
  o.items.forEach((it, i) => it.id = i);
  Q = Object.assign({ requeue: true, first: {}, done: 0, total: o.items.length, queue: o.items.slice(), answered: false }, o);
  qRender();
}
function qRender() {
  const it = Q.queue[0]; Q.answered = false;
  let body = "";
  if (it.kind === "choice") {
    const opts = it.fixed ? it.options.slice() : shuffle(it.options.slice());
    body = `<div class="opts${opts.length === 2 ? " two" : ""}${it.wide ? " one" : ""}">${opts.map((o, i) => `<button class="opt" data-act="opt" data-v="${esc(o)}"><kbd>${i + 1}</kbd>${esc(o)}</button>`).join("")}</div>`;
  } else {
    body = `<form class="wform" id="wform" autocomplete="off">
      <input id="win" type="text" lang="${it.lang === "es" ? "es" : "nb"}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Svar" placeholder="${it.lang === "es" ? "på spansk …" : "på norsk …"}">
      <button class="btn pri" type="submit" id="wsub">Sjekk</button></form>
      ${it.lang === "es" ? `<div class="accbar">${["á", "é", "í", "ó", "ú", "ñ"].map(c => `<button type="button" class="acc" data-act="acc:${c}">${c}</button>`).join("")}</div>` : ""}
      <button class="link" data-act="idk" id="idk">Vet ikke – vis svaret</button>`;
  }
  show(`
  <div class="qhead"><button class="iconbtn x" data-act="home" aria-label="Avslutt">✕</button>
    <div class="bar"><i id="qbar" style="width:${Q.done / Q.total * 100}%"></i></div>
    <span class="qcount" id="qcount">${Q.done}/${Q.total}</span></div>
  <div class="qtitle">${esc(Q.title)}</div>
  <div class="card qcard pop" id="qcard">
    <div class="qlabel">${esc(it.label)}</div>
    <div class="qbig${it.sent ? " sent" : ""}">${it.bigHtml || esc(it.big)} ${it.say ? sayBtn(it.say) : ""}</div>
    ${it.sub ? `<div class="qsub">${it.sub}</div>` : ""}
    ${body}
    <div class="fb" id="fb" aria-live="polite"></div>
  </div>`);
  if (it.kind === "write") setTimeout(() => $("#win") && $("#win").focus(), 60);
}
function qAnswer(r, given) {
  const it = Q.queue[0]; Q.answered = true;
  const ok = ["ok", "accent", "typo"].includes(r.st);
  if (!(it.id in Q.first)) { Q.first[it.id] = ok; if (it.g && !Q.noLv) updLv(it.g, it.kind, ok); if (ok) window.Gull&&Gull.tjen(it.kind === "write" ? 2 : 1); fMeld(it, ok); }
  if (ok || !Q.requeue) Q.done++;
  else Q.queue.splice(Math.min(Q.queue.length, 4), 0, it);
  $("#qbar").style.width = (Q.done / Q.total * 100) + "%";
  $("#qcount").textContent = `${Q.done}/${Q.total}`;
  const fas = `<b>${esc(it.fasit || it.answer)}</b>`;
  let head, extra = "";
  if (r.st === "ok") head = pick(["¡Muy bien!", "¡Correcto!", "¡Bien!", "¡Perfecto!", "Riktig!"]);
  else if (r.st === "accent") { head = "Riktig!"; extra = `Husk aksenten: ${fas}`; }
  else if (r.st === "typo") { head = "Riktig!"; extra = `Det skrives ${fas}.`; }
  else if (r.st === "almost") { head = "Nesten!"; extra = `Riktig er ${fas}.`; }
  else { head = given ? "Ikke helt" : "Svaret er"; extra = given ? `Riktig svar: ${fas}` : fas; }
  if (r.note) extra += (extra ? "<br>" : "") + r.note;
  if (!ok && it.forkl) extra += `<br>${it.forkl}`;
  if (!ok && Q.requeue) extra += `<br><span class="muted">Du får den igjen om litt.</span>`;
  const after = it.after ? `<div class="after">${it.after}</div>` : (it.sayF && TTS ? `<div class="after">${sayBtn(it.sayF, 1)} ${esc(it.sayF)}</div>` : "");
  const fb = $("#fb");
  fb.className = "fb pop " + (ok ? "ok" : r.st === "almost" ? "almost" : "wrong");
  fb.innerHTML = `<div class="head">${ok ? "✓ " : ""}${head}</div>${extra ? `<div class="extra">${extra}</div>` : ""}${after}
    <button class="btn pri" data-act="next" id="nextBtn">Neste →</button>`;
  if (!ok) $("#qcard").classList.add("shake");
  if (it.kind === "write") {
    const inp = $("#win"); inp.readOnly = true; inp.classList.add(ok ? "good" : "bad");
    $("#wsub").hidden = true; $("#idk").hidden = true;
    if ($(".accbar")) $(".accbar").hidden = true;
  }
  if (it.kind !== "write") $("#nextBtn").focus({ preventScroll: true });
  else setTimeout(() => $("#nextBtn") && $("#nextBtn").focus({ preventScroll: true }), 0);
  if (r.st === "ok" && !r.note && !it.after) autoTimer = setTimeout(qNext, 1100);
}
function qNext() { clearTimeout(autoTimer); if (!Q) return; Q.queue.shift(); if (!Q.queue.length) qEnd(); else qRender(); }
function qEnd() {
  const ids = Object.keys(Q.first), right = ids.filter(i => Q.first[i]).length;
  const pct = Math.round(right / Q.total * 100);
  if (Q.total >= 5) window.Gull&&Gull.bonus(pct >= 90 ? 5 : pct >= 75 ? 3 : pct >= 50 ? 1 : 0, "Runde ferdig!");
  const items = Q.items.filter(it => Q.first[it.id] === false);
  if (Q.bestKey) { const b = PS().best; if (b[Q.bestKey] == null || pct > b[Q.bestKey]) { b[Q.bestKey] = pct; Q.rekord = true; } save(); }
  sjekkMerke();
  const [ico, msg] = pct >= 90 ? ["🌟", "¡Fantástico!"] : pct >= 75 ? ["👏", "¡Muy bien!"] : pct >= 50 ? ["💪", "¡Bien! Litt til, så sitter det."] : ["🌱", "Godt jobba – ta en runde til!"];
  const again = Q.again;
  show(`
  <div class="card res pop">
    <div class="big">${ico}</div>
    <h2>${msg}</h2>
    <div class="score">${right} av ${Q.total}</div>
    <p class="muted">riktig på første forsøk${Q.rekord && Q.bestKey ? " – ny rekord! 🏆" : ""}</p>
    ${items.length ? `<div class="misslist"><h3>${Q.requeue ? "Disse måtte du ta flere ganger" : "Disse bør du øve mer på"}</h3>
      ${items.map(it => `<div><span>${esc(it.line)}</span>${it.sayF ? sayBtn(it.sayF, 1) : ""}</div>`).join("")}</div>` : ""}
    <div class="row" style="width:100%">
      <button class="btn pri big" data-act="${again}">Én gang til</button>
      <button class="btn big" data-act="home">Til menyen</button>
    </div>
  </div>`);
}

/* ---------- feilsamler og mestringsmerke (felles/gull.js) ---------- */
const txt = s => String(s == null ? "" : s).replace(/<br\s*\/?>/gi, " ").replace(/<[^>]*>/g, " ")
  .replace(/&(amp|lt|gt|quot|#39);/g, (_, e) => ({ amp: "&", lt: "<", gt: ">", quot: '"', "#39": "'" }[e])).replace(/\s+/g, " ").replace(/ ([.,:;!?)])/g, "$1").replace(/\( /g, "(").trim();
/* Nøkkel: «es:<prøve-id>:<glose/setning>:<type>» – stabil på tvers av økter. Feil og riktig bare på første forsøk. */
function fMeld(it, ok) {
  const f = it.fe; if (!f || !window.Gull) return;
  try {
    const k = `es:${P().id}:${f.k}`;
    if (ok) { if (Gull.riktig) Gull.riktig(k); return; }
    if (!Gull.feil) return;
    const o = { q: txt(f.q), a: txt(f.a || it.fasit || it.answer), emne: f.emne || `Spansk: ${P().tittel}` };
    const alt = it.kind === "choice" && it.options ? shuffle(it.options.filter(x => x !== it.answer)).slice(0, 3) : [];
    if (alt.length >= 2) o.alt = alt;
    if (f.godta && f.godta.length) o.godta = f.godta;
    const fk = f.forkl || it.forkl; if (fk) o.forkl = txt(fk).slice(0, 250);
    Gull.feil(k, o);
  } catch (e) {}
}
/* Merke: minst 90 % på prøveprøven, eller alle glosene i én prøve sitter (nivå 3). */
function sjekkMerke() {
  if (!window.Gull || !Gull.merke) return;
  const nadd = PROVER.some(p => {
    const st = S.prover[p.id]; if (!st) return false;
    return (st.best && st.best.prove >= 90) || (p.gloser.length > 0 && p.gloser.every(g => ((st.lv && st.lv[g.es]) || 0) >= 3));
  });
  if (nadd) try { Gull.merke("spansk-gloser"); } catch (e) {}
}

/* ---------- moduser ---------- */
const MODES = {
  velg() {
    startQuiz({ title: "Velg riktig", again: "velg", items: shuffle(P().gloser.map(g => Math.random() < .5 ? itVelgEsNo(g) : itVelgNoEs(g))) });
  },
  skrivEs() { startQuiz({ title: "Skriv på spansk", again: "skrivEs", items: shuffle(P().gloser.map(itSkrivEs)) }); },
  skrivNo() { startQuiz({ title: "Skriv på norsk", again: "skrivNo", items: shuffle(P().gloser.map(itSkrivNo)) }); },
  vansk() {
    const gl = P().gloser.filter(g => lv(g) < 3); if (!gl.length) return home();
    startQuiz({ title: "Øv på de vanskelige", again: "vansk", items: shuffle(gl.map(g => lv(g) < 1 && Math.random() < .5 ? itVelgNoEs(g) : (Math.random() < .5 ? itSkrivEs(g) : itSkrivNo(g)))) });
  },
  prove() {
    const gl = shuffle(P().gloser.slice()), half = Math.ceil(gl.length / 2);
    startQuiz({ title: "Prøveprøve", again: "prove", requeue: false, bestKey: "prove", items: shuffle(gl.map((g, i) => i < half ? itSkrivEs(g) : itSkrivNo(g))) });
  },
  setn() { startQuiz({ title: "Setninger", again: "setn", bestKey: "setn", noLv: true, items: lagSetninger() }); },
  boy() { startQuiz({ title: "Bøying", again: "boy", bestKey: "boy", noLv: true, items: lagBoying() }); },
};

/* ---------- setninger ---------- */
function splitGap(s) {
  const re = new RegExp(`(^|[^\\p{L}])(${s.ord.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})(?=[^\\p{L}]|$)`, "iu");
  const m = s.es.match(re); if (!m) return [s.es, ""];
  const i = m.index + m[1].length; return [s.es.slice(0, i), s.es.slice(i + m[2].length)];
}
function naerForm(w) {
  const base = w.endsWith("s") ? w.slice(0, -1) : w;
  const sw = /o$/.test(base) ? base.slice(0, -1) + "a" : /a$/.test(base) ? base.slice(0, -1) + "o" : base;
  return [...new Set([base, base + "s", sw, sw + "s"])].filter(x => x !== w);
}
function lagSetninger() {
  const ss = shuffle(P().setninger.slice()), ords = [...new Set(P().setninger.map(s => s.ord))];
  return shuffle(ss.map((s, i) => {
    const [a, b] = splitGap(s), gapHtml = `${esc(a)}<span class="gap">____</span>${esc(b)}`;
    const after = `${sayBtn(s.es, 1)} ${esc(s.es)}`;
    const kind = i % 3;
    if (kind === 0) {
      const near = shuffle(naerForm(s.ord)).slice(0, 1);
      const rest = shuffle(ords.filter(o => o !== s.ord && !near.includes(o))).slice(0, 3 - near.length);
      return { kind: "choice", sent: true, label: "Hvilket ord mangler?", bigHtml: gapHtml, sub: esc(s.no), options: [s.ord, ...near, ...rest], answer: s.ord, line: s.es, sayF: s.es, after,
        fe: { k: `setn:${s.es}:hull`, q: `Hvilket ord mangler? «${a}___${b}» (${s.no})`, emne: `Spansk: ${P().tittel} – setninger` } };
    }
    if (kind === 1) {
      return { kind: "write", lang: "es", sent: true, label: "Skriv ordet som mangler", bigHtml: gapHtml, sub: esc(s.no), fasit: s.ord, check: v => checkEs(v, s.ord), line: s.es, sayF: s.es, after,
        fe: { k: `setn:${s.es}:skriv`, q: `Skriv ordet som mangler: «${a}___${b}» (${s.no})`, emne: `Spansk: ${P().tittel} – setninger` } };
    }
    const others = shuffle(P().setninger.filter(x => x !== s)).slice(0, 3).map(x => x.no);
    return { kind: "choice", sent: true, wide: true, label: "Hva betyr setningen?", big: s.es, say: s.es, options: [s.no, ...others], answer: s.no, line: `${s.es} = ${s.no}`, sayF: s.es,
      fe: { k: `setn:${s.es}:betyr`, q: `Hva betyr «${s.es}»?`, emne: `Spansk: ${P().tittel} – setninger` } };
  }));
}

/* ---------- bøying ---------- */
const TENER = [["Yo", "tengo", "jeg"], ["Tú", "tienes", "du"], ["Él", "tiene", "han"], ["Ella", "tiene", "hun"], ["Nosotros", "tenemos", "vi"], ["Ellos", "tienen", "de"]];
const TENER_FORMS = ["tengo", "tienes", "tiene", "tenemos", "tenéis", "tienen"];
const tenerTabell = `<div class="conj"><span>yo</span><b>tengo</b><span>tú</span><b>tienes</b><span>él / ella</span><b>tiene</b><span>nosotros</span><b>tenemos</b><span>vosotros</span><b>tenéis</b><span>ellos / ellas</span><b>tienen</b></div>`;
function artRegel(g) {
  const e = g.es.slice(-1);
  if (e === "o") return `<b>${esc(g.es)}</b> ender på <b>-o</b> → hankjønn → <b>el</b>.`;
  if (e === "a") return `<b>${esc(g.es)}</b> ender på <b>-a</b> → hunkjønn → <b>la</b>.`;
  return `<b>${esc(g.es)}</b> ender på -${esc(e)}, så den må huskes: <b>${artOf(g)} ${esc(g.es)}</b> (${g.kj === "m" ? "en mann" : "en kvinne"}).`;
}
function checkFrase(v, art, ord) {
  const a = clean(v), m = a.match(/^(el|la|los|las) (.+)$/), w = m ? m[2] : a;
  const r = checkEs(w, ord);
  if (r.st === "wrong" || r.st === "almost") return r;
  if (!m) return { st: "almost", note: `Husk artikkelen: <b>${art} ${esc(ord)}</b>.` };
  if (m[1] !== art) return { st: "almost", note: `Riktig ord, men artikkelen skal være <b>${art}</b>.` };
  return r;
}
const BOY = {
  artikkel: g => ({ kind: "choice", fixed: true, label: "el eller la?", bigHtml: `<span class="gap">___</span> ${esc(g.es)}`, sub: esc(g.no), options: ["el", "la"], answer: artOf(g), forkl: artRegel(g), line: `${artOf(g)} ${g.es}`, sayF: `${artOf(g)} ${g.es}`,
    fe: { k: `art:${g.es}`, q: `el eller la? «___ ${g.es}» (${g.no})`, emne: "Spansk: el eller la" } }),
  flertall: g => {
    const f = `${plArt(g)} ${plOf(g)}`;
    return { kind: "write", lang: "es", label: "Skriv i flertall", big: `${artOf(g)} ${g.es}`, say: `${artOf(g)} ${g.es}`, sub: `${esc(g.no)} → flere`, fasit: f, check: v => checkFrase(v, plArt(g), plOf(g)), forkl: `Legg til <b>-s</b>, og <b>${artOf(g)}</b> blir <b>${plArt(g)}</b>.`, line: `${artOf(g)} ${g.es} → ${f}`, sayF: f,
      fe: { k: `flertall:${g.es}`, q: `Skriv i flertall: «${artOf(g)} ${g.es}» (${g.no} → flere)`, emne: "Spansk: flertall" } };
  },
  kjonn: g => {
    const t = byEs(g.par); if (!t) return null;
    const regel = /o$/.test(g.es) && /a$/.test(t.es) ? "Bytt <b>-o</b> med <b>-a</b>." : /a$/.test(g.es) && /o$/.test(t.es) ? "Bytt <b>-a</b> med <b>-o</b>." : `${esc(g.es)} og ${esc(t.es)} er ulike ord – de må pugges.`;
    return { kind: "write", lang: "es", label: t.kj === "f" ? "Gjør om til hunkjønn" : "Gjør om til hankjønn", bigHtml: `${artOf(g)} ${esc(g.es)} → ${artOf(t)} <span class="gap">___</span>`, sub: `${esc(g.no)} → ${esc(t.no)}`, fasit: t.es, check: v => checkEs(v, t.es), forkl: regel, line: `${g.es} → ${t.es}`, sayF: `${artOf(t)} ${t.es}`,
      fe: { k: `kjonn:${g.es}`, q: `${t.kj === "f" ? "Gjør om til hunkjønn" : "Gjør om til hankjønn"}: ${artOf(g)} ${g.es} → ${artOf(t)} ___ (${g.no} → ${t.no})`, godta: [`${artOf(t)} ${t.es}`], emne: "Spansk: han eller hun" } };
  },
  mi: g => {
    const fl = Math.random() < .5, w = fl ? plOf(g) : g.es;
    return { kind: "choice", fixed: true, label: "mi eller mis?", bigHtml: `<span class="gap">___</span> ${esc(w)}`, options: ["mi", "mis"], answer: fl ? "mis" : "mi", forkl: `<b>mi</b> når det er én, <b>mis</b> når det er flere (ordet ender på -s).`, line: `${fl ? "mis" : "mi"} ${w}`, sayF: `${fl ? "mis" : "mi"} ${w}`,
      fe: { k: `mi:${w}`, q: `mi eller mis? «___ ${w}»`, emne: "Spansk: mi eller mis" } };
  },
  tener: g => {
    const [su, form, no] = pick(TENER), fl = Math.random() < .4;
    const obj = fl ? `dos ${plOf(g)}` : `${unUna(g)} ${g.es}`;
    const opts = [form, ...shuffle(TENER_FORMS.filter(x => x !== form)).slice(0, 3)];
    return { kind: "choice", label: "Hvilken form av tener?", sent: true, bigHtml: `${esc(su)} <span class="gap">___</span> ${esc(obj)}.`, sub: `tener = å ha · ${esc(su.toLowerCase())} = ${no}`, options: opts, answer: form, forkl: tenerTabell, line: `${su} ${form} ${obj}.`, sayF: `${su} ${form} ${obj}.`,
      fe: { k: `tener:${su.toLowerCase()}`, q: `Hvilken form av tener (å ha) passer? «${su} ___ ${obj}.» (${su.toLowerCase()} = ${no})`, forkl: "tener: yo tengo, tú tienes, él/ella tiene, nosotros tenemos, vosotros tenéis, ellos/ellas tienen.", emne: "Spansk: tener" } };
  },
};
const BOY_ANTALL = { artikkel: 3, flertall: 3, kjonn: 2, mi: 3, tener: 4 };
function lagBoying() {
  const gl = P().gloser.filter(g => g.kj), out = [];
  for (const type of P().boying || []) {
    const kand = shuffle(gl.slice()).filter(g => type !== "kjonn" || g.par);
    out.push(...shuffle(kand.slice(0, BOY_ANTALL[type] || 3).map(BOY[type]).filter(Boolean)));
  }
  return out;
}
function boyIntro() {
  const p = P(), ty = p.boying || [], g = t => p.gloser.find(t) || p.gloser[0];
  const mo = g(x => /o$/.test(x.es) && x.kj === "m"), fa = g(x => /a$/.test(x.es) && x.kj === "f");
  const r = [];
  if (ty.includes("artikkel")) r.push(`<div class="rule"><h3>1. el eller la</h3><p>Ord som ender på <b>-o</b> er som regel hankjønn og får <b>el</b>. Ord på <b>-a</b> er hunkjønn og får <b>la</b>.</p><div class="ex">el ${esc(mo.es)} · la ${esc(fa.es)}</div><p class="small muted">Unntak du må huske: <b>el padre</b> og <b>la madre</b> ender på -e.</p></div>`);
  if (ty.includes("flertall")) r.push(`<div class="rule"><h3>2. Flertall</h3><p>Legg til <b>-s</b>. Artikkelen blir <b>los</b> (av el) eller <b>las</b> (av la).</p><div class="ex">el ${esc(mo.es)} → los ${esc(plOf(mo))}<br>la ${esc(fa.es)} → las ${esc(plOf(fa))}</div><p class="small muted">Lurt å vite: <b>los hermanos</b> kan bety både brødrene og søsknene, <b>los padres</b> er foreldrene og <b>los abuelos</b> besteforeldrene.</p></div>`);
  if (ty.includes("kjonn")) r.push(`<div class="rule"><h3>3. Han eller hun</h3><p>Mange ord bytter bare <b>-o</b> med <b>-a</b>.</p><div class="ex">el tío → la tía · el hijo → la hija</div></div>`);
  if (ty.includes("mi")) r.push(`<div class="rule"><h3>4. mi og mis</h3><p><b>mi</b> = min/mi/mitt (én). <b>mis</b> = mine (flere).</p><div class="ex">mi ${esc(mo.es)} · mis ${esc(plOf(mo))}</div></div>`);
  if (ty.includes("tener")) r.push(`<div class="rule"><h3>5. tener – å ha</h3><p>Verbet bøyes etter hvem som har.</p>${tenerTabell}<div class="ex">Tengo una hermana. = Jeg har en søster.</div></div>`);
  show(`
  <button class="back" data-act="home">← Tilbake</button>
  <h2>Bøying – reglene først</h2>
  <p class="muted">Les gjennom, så øver vi. Reglene vises igjen hvis du svarer feil.</p>
  <div class="rules">${r.join("")}</div>
  <button class="btn pri big" data-act="boy">Start øvingen →</button>`);
}

/* ---------- koble sammen ---------- */
let K = null;
function koble() {
  const gl = shuffle(P().gloser.slice()), nR = Math.ceil(gl.length / 6), size = Math.ceil(gl.length / nR), rounds = [];
  for (let i = 0; i < gl.length; i += size) rounds.push(gl.slice(i, i + size));
  K = { rounds, r: 0, sel: null, err: 0, t0: Date.now(), feil: new Set() };
  kRender();
}
function kRender() {
  const rd = K.rounds[K.r]; K.left = rd.length; K.sel = null;
  const L = shuffle(rd.slice()), R = shuffle(rd.slice());
  show(`
  <div class="qhead"><button class="iconbtn x" data-act="home" aria-label="Avslutt">✕</button>
    <div class="bar"><i style="width:${K.r / K.rounds.length * 100}%"></i></div>
    <span class="pill" id="ktid">⏱ 0</span></div>
  <div class="qtitle">Koble sammen – runde ${K.r + 1} av ${K.rounds.length}</div>
  <p class="muted small">Trykk på et spansk ord og så på det norske som hører til.</p>
  <div class="kgrid">
    <div class="kcol">${L.map(g => `<button class="kb" data-act="kpick" data-side="es" data-k="${esc(g.es)}">${esc(g.es)}</button>`).join("")}</div>
    <div class="kcol">${R.map(g => `<button class="kb" data-act="kpick" data-side="no" data-k="${esc(g.es)}">${esc(g.no)}</button>`).join("")}</div>
  </div>
  <p class="small muted" id="kerr">Feil: ${K.err}</p>`);
  const tick = () => { const e = $("#ktid"); if (e) e.textContent = `⏱ ${Math.floor((Date.now() - K.t0) / 1000)}`; };
  tick(); kTimer = setInterval(tick, 1000);
}
function kPick(b) {
  if (b.classList.contains("done")) return;
  if (K.sel === b) { b.classList.remove("sel"); K.sel = null; return; }
  if (!K.sel || K.sel.dataset.side === b.dataset.side) { if (K.sel) K.sel.classList.remove("sel"); K.sel = b; b.classList.add("sel"); return; }
  const a = K.sel; K.sel = null; a.classList.remove("sel");
  if (a.dataset.k === b.dataset.k) {
    [a, b].forEach(x => { x.classList.add("done"); x.disabled = true; });
    const g = byEs(a.dataset.k); if (!K.feil.has(g.es)) updLv(g, "choice", true);
    if (--K.left === 0) setTimeout(kNeste, 450);
  } else {
    K.err++; K.feil.add(a.dataset.k); K.feil.add(b.dataset.k);
    [a, b].forEach(x => { x.classList.add("bad", "shake"); setTimeout(() => x.classList.remove("bad", "shake"), 550); });
    $("#kerr").textContent = `Feil: ${K.err}`;
  }
}
function kNeste() {
  if (!K) return;
  if (++K.r < K.rounds.length) return kRender();
  const sek = Math.round((Date.now() - K.t0) / 1000), b = PS().best, rek = b.koble == null || sek < b.koble;
  if (rek) { b.koble = sek; save(); }
  const n = K.rounds.flat().length;
  window.Gull&&Gull.bonus(Math.max(2, Math.round(n / 2) - K.err), K.err === 0 ? "Ingen feil!" : "Alle parene funnet!");
  show(`
  <div class="card res pop">
    <div class="big">${K.err === 0 ? "🌟" : "🧩"}</div>
    <h2>${K.err === 0 ? "¡Perfecto! Ingen feil!" : "Alle parene funnet!"}</h2>
    <div class="score">${sek} sek</div>
    <p class="muted">${n} par · ${K.err} feil${rek ? " · ny rekord! 🏆" : ` · rekorden er ${b.koble} sek`}</p>
    <div class="row" style="width:100%">
      <button class="btn pri big" data-act="koble">Én gang til</button>
      <button class="btn big" data-act="home">Til menyen</button>
    </div>
  </div>`);
  K = null;
}

/* ---------- handlinger ---------- */
const ACT = {
  home, kort, koble, boyIntro,
  velg: () => MODES.velg(), skrivEs: () => MODES.skrivEs(), skrivNo: () => MODES.skrivNo(), vansk: () => MODES.vansk(),
  prove: () => MODES.prove(), setn: () => MODES.setn(), boy: () => MODES.boy(),
  theme() { S.theme = erMork() ? "light" : "dark"; save(); applyTheme(); },
  velgProve(id) { S.valgt = id; save(); home(); },
  reset() { if (confirm(`Nullstille fremgangen for «${P().tittel}»?`)) { delete S.prover[P().id]; save(); home(); } },
  flip() { F.on = !F.on; $("#flip").classList.toggle("on", F.on); },
  fnext() { F.i = (F.i + 1) % F.list.length; F.on = false; fRender(); },
  fprev() { F.i = (F.i - 1 + F.list.length) % F.list.length; F.on = false; fRender(); },
  fmix() { F.mix = !F.mix; F.list = F.mix ? shuffle(P().gloser.slice()) : P().gloser.slice(); F.i = 0; F.on = false; fRender(); },
  fnofirst() { F.noFirst = !F.noFirst; F.on = false; fRender(); },
  opt(_, b) {
    if (!Q || Q.answered) return;
    const it = Q.queue[0], v = b.dataset.v, ok = v === it.answer;
    document.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.dataset.v === it.answer) x.classList.add("good"); });
    if (!ok) b.classList.add("bad");
    qAnswer({ st: ok ? "ok" : "wrong" }, true);
  },
  idk() { if (Q && !Q.answered) qAnswer({ st: "wrong" }, false); },
  next() { qNext(); },
  acc(ch) {
    const i = $("#win"); if (!i || i.readOnly) return;
    const s = i.selectionStart ?? i.value.length, e = i.selectionEnd ?? s;
    i.value = i.value.slice(0, s) + ch + i.value.slice(e); i.focus(); i.setSelectionRange(s + 1, s + 1);
  },
  kpick(_, b) { kPick(b); },
};
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]"); if (s) { speak(s.dataset.say); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const [act, arg] = b.dataset.act.split(/:(.*)/s);
  if (ACT[act]) ACT[act](arg, b, e);
});
document.addEventListener("mousedown", e => { if (e.target.closest(".acc")) e.preventDefault(); });
document.addEventListener("submit", e => {
  if (e.target.id !== "wform") return; e.preventDefault();
  if (!Q) return;
  if (Q.answered) return qNext();
  const v = $("#win").value; if (!v.trim()) return;
  qAnswer(Q.queue[0].check(v), true);
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if ($("#flip")) {
    if (e.key === " ") { e.preventDefault(); ACT.flip(); }
    else if (e.key === "ArrowRight") ACT.fnext();
    else if (e.key === "ArrowLeft") ACT.fprev();
    return;
  }
  if (Q && $("#qcard")) {
    if (!Q.answered && Q.queue[0].kind === "choice" && /^[1-9]$/.test(e.key)) {
      const b = document.querySelectorAll(".opt")[+e.key - 1]; if (b) b.click();
    } else if (Q.answered && e.key === "Enter" && e.target.id !== "nextBtn") { e.preventDefault(); qNext(); }
  }
});

applyTheme();
home();
sjekkMerke();
</script>
