<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feilsamleren</title>
<meta name="description" content="Ta igjen det du har bommet på i øveprøvene og tjen comeback-gull">
<meta name="theme-color" content="#5b3fd1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<script src="felles/gull.js" data-merke="av"></script>
<script src="felles/spill.js"></script>
<style>
:root{
  --bg:#fbf7ef; --kort:#ffffff; --kort2:#f6efe2; --tekst:#2a2620; --dempet:#6f675b; --kant:#eadfca;
  --pri:#5b3fd1; --pri-tekst:#ffffff; --pri-myk:#ece7ff; --gull:#c98a00; --ok:#2e7d32; --ok-myk:#e3f4e4; --feil:#c62828; --feil-myk:#fde7e7;
  --fd:"Fredoka","Segoe UI",system-ui,sans-serif; --fb:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#16141d; --kort:#211e2b; --kort2:#2a2636; --tekst:#f3efe6; --dempet:#b3ab9c; --kant:#363145;
         --pri:#a593ff; --pri-tekst:#1a1240; --pri-myk:#2d2752; --gull:#ffcf4d; --ok:#7bd88f; --ok-myk:#18321d; --feil:#ff8a80; --feil-myk:#3a1c1c; color-scheme:dark; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tekst);font:17px/1.45 var(--fb);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);font-weight:700;margin:0;line-height:1.15}
.muted{color:var(--dempet)}
.small{font-size:.88rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto;padding:12px 16px}
.top a{color:var(--pri);font-weight:700;text-decoration:none;font-family:var(--fd);font-size:1.05rem}
.pung{display:flex;align-items:center;gap:6px;font-family:var(--fd);font-weight:700;font-size:1.15rem;background:var(--kort);border:2px solid var(--kant);border-radius:999px;padding:4px 14px;color:inherit;text-decoration:none}
.pung b{color:var(--gull)}
main{max-width:760px;margin:0 auto;padding:0 16px 60px}
.kort{background:var(--kort);border:1px solid var(--kant);border-radius:18px;padding:16px;margin-bottom:14px}
.helt{display:flex;gap:16px;align-items:center}
.helt .ava{width:96px;height:110px;flex:none}
.helt .ava svg{width:100%;height:100%;display:block}
.helt h1{font-size:1.8rem}
.tall{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tall div{background:var(--kort2);border-radius:14px;padding:10px;text-align:center}
.tall b{display:block;font-family:var(--fd);font-size:1.7rem;line-height:1.1}
.tall span{font-size:.82rem;color:var(--dempet)}
.knapp{border:2px solid var(--kant);background:var(--kort);border-radius:14px;padding:10px 18px;font-family:var(--fd);font-weight:700;font-size:1.05rem;color:inherit;text-decoration:none;display:inline-block}
.knapp.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-tekst)}
.knapp.stor{font-size:1.25rem;padding:14px 26px}
.knapp:disabled{opacity:.55;cursor:default}
.knapper{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.oppgave .emne{font-size:.85rem;font-weight:700;color:var(--dempet);text-transform:uppercase;letter-spacing:.04em}
.oppgave .q{font-size:1.25rem;font-weight:600;margin:8px 0 14px;line-height:1.35}
.oppgave .bar{height:8px;border-radius:9px;background:var(--kort2);overflow:hidden;margin-bottom:12px}
.oppgave .bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.valg{display:grid;gap:8px}
.valg button{text-align:left;border:2px solid var(--kant);background:var(--kort2);border-radius:14px;padding:12px 14px;font-weight:600}
.valg button:hover:not(:disabled){border-color:var(--pri)}
.valg button.rett{border-color:var(--ok);background:var(--ok-myk)}
.valg button.gal{border-color:var(--feil);background:var(--feil-myk)}
form.skriv{display:flex;gap:8px;flex-wrap:wrap}
form.skriv input{flex:1 1 220px;border:2px solid var(--kant);background:var(--kort2);border-radius:12px;padding:12px;font-size:1.15rem}
.svar{margin-top:14px;padding:12px 14px;border-radius:14px}
.svar.ok{background:var(--ok-myk);border:1.5px solid var(--ok)}
.svar.nei{background:var(--feil-myk);border:1.5px solid var(--feil)}
.svar b.h{display:block;font-family:var(--fd);font-size:1.15rem;margin-bottom:2px}
.gruppe h2{font-size:1.1rem;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.gruppe h2 a{margin-left:auto;font-size:.85rem;font-family:var(--fb);color:var(--pri);font-weight:700;text-decoration:none}
.rad{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--kant);font-size:.95rem}
.rad:first-of-type{border-top:0}
.rad .q2{flex:1;min-width:0}
.status{flex:none;font-size:.78rem;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--kort2);color:var(--dempet);white-space:nowrap}
.status.klar{background:var(--pri);color:var(--pri-tekst)}
.prikker{letter-spacing:2px;color:var(--gull);font-size:.8rem}
.tom{text-align:center;padding:28px 16px}
.tom .stor{font-size:3rem}
</style>
</head>
<body>
<header class="top">
  <a href="forside/">← Øveprøver</a>
  <a class="pung" href="avatar.html" data-gull-pung><span class="gm-mynt" aria-hidden="true"></span><b id="saldo">0</b> gull</a>
</header>
<main id="app"></main>

<script>
"use strict";
const G = window.Gull;
const $ = s => document.querySelector(s);
const esc = G.esc;
const app = $("#app");
let okt = null;   // pågående repetisjon

function spillInfo(spill) {
  const sp = (window.SPILL || []).find(x => G.filKey(x.fil) === spill);
  return sp ? { navn: sp.ikon + " " + sp.tittel, fil: sp.fil } : { navn: spill, fil: spill + ".html" };
}
function stokk(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function naarKlar(e) {
  const min = Math.ceil((e.neste - Date.now()) / 60e3);
  if (min <= 0) return "Klar nå";
  if (min < 60) return `Klar om ${min} min`;
  const d = new Date(e.neste), i = new Date(); i.setHours(24, 0, 0, 0);
  return d <= i ? "Klar i morgen" : "Klar " + d.toLocaleDateString("no", { weekday: "long" });
}

/* Sammenligning: store/små bokstaver, mellomrom og punktum til slutt spiller ingen rolle.
   Mangler bare aksenter (á, é, ñ …) godtas svaret, men barnet får beskjed. å, æ og ø må være riktige. */
function norm(t) { return String(t || "").toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, " ").replace(/^[\s«"]+|[\s.!?»"]+$/g, "").trim(); }
function loss(t) { return norm(t).normalize("NFD").replace(/[̀́̃̈]/g, "").normalize("NFC"); }
function sjekk(e, svar) {
  const mulige = [e.a].concat(e.godta || []);
  if (mulige.some(m => norm(m) === norm(svar))) return "ok";
  if (mulige.some(m => loss(m) === loss(svar))) return "aksent";
  return "feil";
}

/* ---------- oversikt ---------- */
function visOversikt() {
  okt = null;
  const s = G.tilstand(), fl = G.feilListe(s), klare = fl.filter(e => e.klar);
  $("#saldo").textContent = s.gull;
  const ava = s.laget ? G.tegn(s, { bakgrunn: false, venn: false, jubel: !fl.length, vb: "40 20 160 230" }) : "";
  let html = `<section class="kort"><div class="helt">${ava ? `<div class="ava">${ava}</div>` : ""}<div>
      <h1>Feilsamleren</h1>
      <p style="margin:6px 0 0">Her samles det du har bommet på i spillene. Klarer du en oppgave etter en liten pause, får du <b>3 comeback-gull</b>. Klarer du den igjen dagen etter, <b>sitter</b> den – og du får 3 gull til.</p>
    </div></div>
    <div class="tall"><div><b>${klare.length}</b><span>klare nå</span></div><div><b>${fl.length - klare.length}</b><span>venter på pause</span></div><div><b>${s.sitter || 0}</b><span>sitter nå</span></div></div>
    ${klare.length ? `<div class="knapper"><button class="knapp pri stor" id="start">Ta igjen ${Math.min(klare.length, 10)} ${klare.length === 1 ? "feil" : "feil"} →</button></div>` : ""}
  </section>`;
  if (!fl.length) {
    html += `<section class="kort tom"><div class="stor">🌟</div><h2>Ingen feil å ta igjen!</h2>
      <p class="muted">Når du bommer i et spill, havner oppgaven her. Det er helt greit å bomme – det er sånn man finner ut hva man skal øve på.</p>
      <a class="knapp pri" href="forside/">Velg et spill</a></section>`;
  } else {
    const grupper = {};
    fl.forEach(e => (grupper[e.spill] = grupper[e.spill] || []).push(e));
    html += Object.entries(grupper).map(([spill, liste]) => {
      const info = spillInfo(spill);
      return `<section class="kort gruppe"><h2>${esc(info.navn)} <a href="${esc(info.fil)}">Øv i spillet →</a></h2>
        ${liste.map(e => `<div class="rad"><span class="q2">${esc(e.q)}<br><span class="small muted">${e.emne ? esc(e.emne) + " · " : ""}<span class="prikker" title="${e.boks ? "Klart én gang – én gang til så sitter den" : "Ikke klart ennå"}">${e.boks ? "●○" : "○○"}</span></span></span>
          <span class="status${e.klar ? " klar" : ""}">${naarKlar(e)}</span></div>`).join("")}</section>`;
    }).join("");
  }
  app.innerHTML = html;
  const b = $("#start"); if (b) b.onclick = startOkt;
}

/* ---------- repetisjon ---------- */
function startOkt() {
  const klare = stokk(G.feilListe().filter(e => e.klar)).slice(0, 10);
  if (!klare.length) return visOversikt();
  okt = { liste: klare, i: 0, rett: 0, gull: 0, besvart: false };
  visOppgave();
}
function visOppgave() {
  const e = okt.liste[okt.i]; okt.besvart = false;
  const info = spillInfo(e.spill);
  const valg = e.alt && e.alt.length ? stokk([e.a].concat(e.alt)) : null;
  app.innerHTML = `<section class="kort oppgave">
    <div class="bar"><i style="width:${100 * okt.i / okt.liste.length}%"></i></div>
    <div class="emne">${esc(info.navn)}${e.emne ? " · " + esc(e.emne) : ""} · ${okt.i + 1} av ${okt.liste.length}</div>
    <div class="q">${esc(e.q)}</div>
    ${valg ? `<div class="valg">${valg.map(v => `<button data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>`
      : `<form class="skriv" id="skriv"><input id="inn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Skriv svaret" aria-label="Svaret ditt"><button class="knapp pri">Sjekk</button></form>`}
    <div id="svar"></div>
  </section>
  <div class="knapper"><button class="knapp" id="avbryt">Avslutt</button></div>`;
  if (valg) app.querySelectorAll(".valg button").forEach(b => b.onclick = () => svar(b.dataset.v, b));
  else { const f = $("#skriv"); f.onsubmit = ev => { ev.preventDefault(); const v = $("#inn").value; if (v.trim()) svar(v); }; setTimeout(() => $("#inn") && $("#inn").focus(), 30); }
  $("#avbryt").onclick = visOversikt;
}
function svar(v, knapp) {
  if (okt.besvart) return; okt.besvart = true;
  const e = okt.liste[okt.i];
  const res = e.alt && e.alt.length ? (v === e.a ? "ok" : "feil") : sjekk(e, v);
  const ok = res !== "feil";
  if (e.alt && e.alt.length) app.querySelectorAll(".valg button").forEach(b => { b.disabled = true; if (b.dataset.v === e.a) b.classList.add("rett"); else if (b === knapp) b.classList.add("gal"); });
  else { $("#inn").readOnly = true; }
  const fikk = G.repeter(e.k, ok);
  if (ok) { okt.rett++; okt.gull += fikk; }
  const siste = okt.i + 1 >= okt.liste.length;
  $("#svar").innerHTML = `<div class="svar ${ok ? "ok" : "nei"}"><b class="h">${ok ? (e.boks ? "Den sitter! ✓" : "Comeback! ✓") : "Ikke helt ennå"}</b>
      ${res === "aksent" ? `Husk aksenten: <b>${esc(e.a)}</b>. ` : ""}${!ok ? `Riktig svar: <b>${esc(e.a)}</b>. ` : ""}${fikk ? `+${fikk} comeback-gull.` : ""}
      ${!ok && e.forkl ? `<div class="small" style="margin-top:6px">${esc(e.forkl)}</div>` : ""}
      ${!ok ? `<div class="small muted" style="margin-top:6px">Den kommer tilbake om en halvtime.</div>` : ""}</div>
    <div class="knapper"><button class="knapp pri" id="neste">${siste ? "Se resultatet" : "Neste →"}</button></div>`;
  $("#saldo").textContent = G.saldo();
  const n = $("#neste"); n.focus(); n.onclick = () => { okt.i++; if (okt.i < okt.liste.length) visOppgave(); else visSlutt(); };
}
function visSlutt() {
  const s = G.tilstand();
  app.innerHTML = `<section class="kort tom">${s.laget ? `<div style="width:120px;height:150px;margin:0 auto">${G.tegn(s, { bakgrunn: false, venn: false, jubel: okt.rett > 0, vb: "40 20 160 230" })}</div>` : ""}
    <h2>${okt.rett === okt.liste.length ? "Alle satt! 🌟" : okt.rett ? "Bra jobba!" : "Godt forsøk!"}</h2>
    <p>Du klarte ${okt.rett} av ${okt.liste.length}${okt.gull ? ` og fikk <b>${okt.gull} comeback-gull</b>` : ""}.</p>
    <p class="muted small">De du bommet på, kommer tilbake om en halvtime. De du klarte for første gang, kommer tilbake i morgen – klarer du dem da, sitter de.</p>
    <div class="knapper" style="justify-content:center"><button class="knapp pri" id="tilbake">Til Feilsamleren</button><a class="knapp" href="forside/">Til forsiden</a></div></section>`;
  $("#tilbake").onclick = visOversikt;
}

G.onEndring(() => { $("#saldo").textContent = G.saldo(); });
window.addEventListener("pageshow", e => { if (e.persisted && !okt) visOversikt(); });
visOversikt();
setInterval(() => { if (!okt) visOversikt(); }, 60e3);
</script>
</body>
</html>
